<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tennis Jeunes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Championnat du Maroc par Équipes des Jeunes 2025/2026 – Scores</title>
<style>
:root{
  --paper:#eef2f5; --card:#ffffff; --ink:#14212e; --muted:#5f6f80; --line:#d5dde5;
  --court:#1d4e89; --court-2:#2a67ad; --ball:#d9e84a; --win:#1f8a55; --win-soft:#e1f3e9;
  --lose:#b43a2e; --gold:#b8860b; --silver:#6b7b8c; --board:#10233a;
  --fd:"Bahnschrift","DIN Alternate","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e1620; --card:#16212d; --ink:#e6edf3; --muted:#93a3b3; --line:#27384a;
  --court:#4f8fd6; --court-2:#6aa6e6; --win:#4cc185; --win-soft:#143325; --lose:#ec7a6c; --gold:#e0b64a; --silver:#a8b6c4; --board:#0a1522;
}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

/* En-tête façon court */
header{background:var(--court);color:#fff;position:relative;overflow:hidden;padding:18px 16px 14px}
header::before{content:"";position:absolute;inset:10px 12px;border:2px solid rgba(255,255,255,.28);border-radius:2px;pointer-events:none}
header::after{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:2px solid rgba(255,255,255,.22)}
.hw{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:4px 10px}
h1{font:700 clamp(21px,5vw,30px)/1.1 var(--fd);margin:0;letter-spacing:.2px}
.sub{opacity:.85;font-size:13.5px;margin-top:4px}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font:600 13px var(--fd)}
.bar{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;background:var(--ball);width:0;transition:width .3s}
.saved{font:500 12px var(--fb);opacity:.8;transition:opacity .3s;color:#dfe8f2;white-space:nowrap}
.saved.on{opacity:1;color:var(--ball)}
.saved.err{opacity:1;color:#ffc2b8;font-weight:700}
#bkbar:empty{display:none}
.whobar{position:relative;z-index:1;margin-top:8px}
.whobar:empty{display:none}
.who{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:4px 12px;font:600 13px var(--fb);cursor:pointer;text-align:left}
.who b{color:var(--ball);font-weight:700}
.who span{opacity:.85;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncst{background:none;border:1px solid rgba(255,255,255,.3);color:#dfe8f2;border-radius:14px;padding:2px 9px;font:500 12px var(--fb);cursor:pointer;white-space:nowrap}
.syncst.err{color:#ffc2b8;border-color:#ffc2b8}
.syncst.run{color:var(--ball);border-color:var(--ball)}
.prog{flex-wrap:wrap}
.fl{display:block;font-size:13px;color:var(--muted);margin:8px 0}
.fl input{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:14px;color:var(--ink)}
.steps{margin:8px 0;padding-left:20px;font-size:13.5px}
.steps li{margin:5px 0}
.bk{max-width:980px;margin:10px auto 0;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;background:#fff6d6;color:#5a4300;border:1px solid #e8cf73}
.bk.err{background:#fde3df;color:#7a1f14;border-color:#e8a095}
.bk span{flex:1;min-width:200px}
.bk .btn{background:#fff;color:#14212e}
#bkbar{padding:0 14px}
.stline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.stline:first-of-type{border-top:0}
.stline b.ok{color:var(--win)} .stline b.ko{color:var(--lose)}
.snap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.snap small{color:var(--muted)}

nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav .nw{max-width:980px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:none;border:0;padding:13px 16px;font:600 15px var(--fd);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--court);border-bottom-color:var(--court)}

main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
h2{font:700 20px/1.2 var(--fd);margin:22px 0 10px}
h3{font:700 16px var(--fd);margin:18px 0 8px;color:var(--muted)}

/* Sélecteur de catégories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.cg b{display:block;font:700 14px var(--fd);margin:0 0 6px 2px}
.cg .row{display:flex;gap:6px}
.chip{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 4px;cursor:pointer;text-align:center;font:600 13px var(--fd)}
.chip small{display:block;font:500 11px var(--fb);color:var(--muted)}
.chip.on{background:var(--court);border-color:var(--court);color:#fff}
.chip.on small{color:rgba(255,255,255,.8)}
.chip.full small{color:var(--win)}
.chip.on.full small{color:var(--ball)}

.cat-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:20px 0 4px}
.cat-title h2{margin:0}
.cat-title span{color:var(--muted);font-size:13.5px}

/* Classements */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl header,.tbl .th{background:none;color:var(--ink);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font:700 15px var(--fd);border-bottom:1px solid var(--line)}
.tbl .th small{font:500 12px var(--fb);color:var(--muted)}
.sc-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;white-space:nowrap}
th{font:600 12px var(--fb);color:var(--muted)}
td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr{border-top:1px solid var(--line)}
tr.q td:first-child{box-shadow:inset 4px 0 var(--win)}
tr.g1 td:first-child{box-shadow:inset 4px 0 var(--gold)}
tr.g2 td:first-child{box-shadow:inset 4px 0 var(--silver)}
td.v{font-weight:700}
.legend{font-size:12px;color:var(--muted);margin-top:6px}

/* Tableau final */
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.bk-col{display:flex;flex-direction:column;gap:10px}
.bk{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13.5px}
.bk div{display:flex;justify-content:space-between;gap:6px;padding:6px 9px}
.bk div+div{border-top:1px solid var(--line)}
.bk .lb{color:var(--muted);font-size:11.5px;min-width:28px}
.bk .nm{flex:1;font-weight:600}
.bk .nm.prov{font-weight:400;color:var(--muted);font-style:italic}
.bk .w{background:var(--win-soft)}
.bk-t{font:700 12.5px var(--fd);color:var(--muted);margin-bottom:-4px}
.champ{margin-top:8px;padding:10px;border-radius:8px;background:var(--board);color:var(--ball);font:700 16px var(--fd);text-align:center}
.champ small{display:block;color:#c9d3de;font:500 12px var(--fb)}

/* Cartes rencontre */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mc.done{border-color:color-mix(in srgb,var(--win) 45%,var(--line))}
.mc.flash{animation:fl 1.4s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--ball)}100%{box-shadow:0 0 0 0 transparent}}
.mc-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tag{font-weight:700;color:var(--court)}
.mc-t{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px}
.tm{font:700 15px var(--fd);overflow-wrap:anywhere}
.tm[data-s="2"]{text-align:right}
.tm.win{color:var(--win)}
.tm.win::after{content:" ●";font-size:9px;vertical-align:middle;color:var(--ball);text-shadow:0 0 1px var(--ink)}
.tm[data-s="2"].win::after{content:""}
.tm[data-s="2"].win::before{content:"● ";font-size:9px;vertical-align:middle;color:var(--ball);text-shadow:0 0 1px var(--ink)}
.sb{background:var(--board);color:var(--ball);font:700 18px var(--fd);padding:4px 10px;border-radius:6px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.sb small{display:block;font:500 10px var(--fb);color:#c9d3de;letter-spacing:0}
details{margin-top:6px}
summary{cursor:pointer;font-size:13px;color:var(--court);font-weight:600;padding:4px 0;list-style-position:inside}
.pt{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px;margin:6px 0 2px}
.pt span{font-size:12.5px;color:var(--muted)}
.pt input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-variant-numeric:tabular-nums}
.pr{display:block;font-size:11.5px;color:var(--win);margin-left:76px;min-height:15px}
.pr.pend{color:var(--muted)}
.mc-f{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.mc-f select{flex:1;min-width:0;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.pri{background:var(--court);border-color:var(--court);color:#fff}
.btn.danger{color:var(--lose)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.wait{border-style:dashed;color:var(--muted);font-size:13.5px}
.fin-info{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--muted)}
.fin-info input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}

/* Programme */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .chip{flex:0 0 auto;padding:7px 11px}
.filters select{padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.venue{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.venue h4{margin:0;padding:9px 12px;font:700 15px var(--fd);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.venue h4 small{font:500 12px var(--fb);color:var(--muted)}
.prow{display:grid;grid-template-columns:110px 1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.prow:first-of-type{border-top:0}
.prow:hover{background:var(--paper)}
.prow .c{font-size:12px;color:var(--muted)}
.prow .a{font-weight:600;text-align:right}
.prow .b{font-weight:600}
.prow .s{font:700 14px var(--fd);background:var(--board);color:var(--ball);padding:2px 8px;border-radius:5px;min-width:46px;text-align:center}
.prow .s.e{background:transparent;color:var(--muted);border:1px solid var(--line)}
.prow .w{color:var(--win)}
@media (max-width:520px){.prow{grid-template-columns:1fr auto 1fr}.prow .c{grid-column:1/-1}}

/* Clubs */
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.club{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.club-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.club-h b{font:700 19px var(--fd)}
.club-h span{font:700 15px var(--fd);font-variant-numeric:tabular-nums}
.club-h span em{font-style:normal;color:var(--win)}
.club-h span i{font-style:normal;color:var(--lose)}
.wl{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line);margin:8px 0}
.wl i{background:var(--win)} .wl u{background:var(--lose)}
.club .meta{font-size:12.5px;color:var(--muted)}
.team{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.team:first-of-type{margin-top:6px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.pill.silver{background:var(--silver);border-color:var(--silver);color:#fff}
.pill.ok{background:var(--win-soft);border-color:var(--win);color:var(--win)}
.pill.out{color:var(--lose);border-color:var(--lose)}

/* Données */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel p{margin:6px 0;max-width:70ch}
.panel select{padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);width:100%;max-width:340px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:24px;background:var(--card);border:1px dashed var(--line);border-radius:10px;margin-top:12px}
/* Mon club */
.mc.mine{border-color:var(--court);box-shadow:inset 4px 0 var(--court)}
.me{text-decoration:underline;text-decoration-color:var(--ball);text-decoration-thickness:3px;text-underline-offset:4px}
tr.me{background:color-mix(in srgb,var(--ball) 24%,transparent)}
.prow.mine{box-shadow:inset 4px 0 var(--court)}
.club.mine{border:2px solid var(--court)}
.club-f{display:flex;justify-content:flex-end;margin-top:8px}
.hero{background:var(--board);color:#fff;border-radius:12px;padding:16px;margin-top:14px;display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:space-between;align-items:center}
.hero .nm small{display:block;font:500 12px var(--fb);color:#c9d3de}
.hero .nm b{font:700 32px/1 var(--fd);color:var(--ball)}
.hero .st{display:flex;gap:18px;font:700 22px var(--fd);font-variant-numeric:tabular-nums}
.hero .st small{display:block;font:500 11.5px var(--fb);color:#c9d3de}
.hero .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.pick .btn{padding:16px 8px;font:700 17px var(--fd)}
.tlist .team{padding:9px 12px;border-top:1px solid var(--line);margin:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;text-align:left}
.tlist .team:first-of-type{border-top:0}
/* Partage */
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.venue h4 .btn{font:600 12px var(--fb);padding:4px 10px}
.venue h4 span small{margin-left:6px}
.shf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.shf select{padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);width:auto;max-width:100%}
.panel textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:13px/1.45 var(--fb);resize:vertical}
.rmsg{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--win-soft);font-size:13.5px}
.rmsg.err{background:color-mix(in srgb,var(--lose) 14%,transparent)}
.rmsg ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--board);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
/* Joueurs */
.pb{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.pbh{font:700 12.5px var(--fd);color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.pb input{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:14px}
.pb input.scin{font-variant-numeric:tabular-nums;background:var(--card);border-color:color-mix(in srgb,var(--court) 40%,var(--line))}
.pn select,.dsel select{width:100%;min-width:0;padding:8px 6px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:14px}
.dsel{display:grid;gap:4px}
.rt{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--card)}
.rt.mine{border:2px solid var(--court)}
.rth{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.rt input{width:100%;padding:7px 9px;margin-top:5px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.rth input{width:58px;margin:0}
.linkb{background:none;border:0;color:var(--court);font-weight:700;padding:0;cursor:pointer;text-decoration:underline;font-size:inherit}
.pr{margin-left:0!important;margin-top:3px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.rt b{display:block;font:700 14px var(--fd);margin-bottom:4px}
.rt textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font:13.5px/1.5 var(--fb);resize:vertical}
details.panel>summary{font:700 15px var(--fd);color:var(--ink)}
/* Rapport PDF */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  :root{padding:0}
  body{background:#fff}
  body>header,body>nav,main,.toast{display:none!important}
  #print{display:block;--ink:#14212e;--muted:#5a6573;--line:#cfd6dd;--card:#fff;--paper:#f2f4f6;--win:#1f7a4b;--win-soft:#e3f2e9;--court:#1d4e89;--ball:#d9e84a;--board:#10233a;--gold:#b8860b;--silver:#6b7b8c;--lose:#b43a2e;
    color:var(--ink);background:#fff;font:10pt/1.4 var(--fb);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .pg{break-before:page}
  #print .band{background:var(--court);color:#fff;padding:16px 18px;border-radius:6px;margin-bottom:14px}
  #print .band h1{font:700 21pt/1.15 var(--fd);margin:0}
  #print .band p{margin:4px 0 0;opacity:.9}
  #print h2{font:700 15pt var(--fd);color:var(--court);border-bottom:2px solid var(--court);padding-bottom:3px;margin:0 0 8px}
  #print h3{font:700 11pt var(--fd);color:var(--ink);margin:12px 0 5px}
  #print table{font-size:9.3pt;width:100%}
  #print th,#print td{padding:4px 6px;border-bottom:1px solid var(--line)}
  #print tr{break-inside:avoid}
  #print .tbl{border:1px solid var(--line);border-radius:6px;break-inside:avoid}
  #print .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #print .legend{font-size:8.5pt}
  #print .res td{text-align:left}
  #print .res td.sc{text-align:center;font-weight:700;white-space:nowrap;width:60px}
  #print .res td.w{font-weight:700;color:var(--win)}
  #print .res tr.main td{border-bottom:0;padding-bottom:1px}
  #print .res tr.det td{font-size:8.3pt;color:var(--muted);white-space:normal;padding-top:0}
  #print .res tr.me td{background:#f7f9d9}
  #print .champ-p{margin:6px 0;padding:6px 10px;border-left:4px solid var(--gold);background:#fbf6e6;font-size:10.5pt}
  #print .muted{color:var(--muted);font-size:9pt}
  #print .sum td{text-align:left}

const IDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('frmt-jeunes-2026',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(k){return this.tx('readonly',s=>s.get(k));},set(k,v){return this.tx('readwrite',s=>s.put(v,k));},del(k){return this.tx('readwrite',s=>s.delete(k));},keys(){return this.tx('readonly',s=>s.getAllKeys());}};

function updBar(){const b=document.getElementById('bkbar');if(!b)return;const n=pending();let x='';

  else if(BK.file&&!BK.filePerm)x=`<div class="bk"><span>La sauvegarde automatique dans le fichier « ${h(BK.file.name)} » est en pause.</span><button class="btn sm" data-bk="perm">Réactiver</button></div>`;

function addList(c,t,items){const k=rkey(c,t);const L=Array.from(S.roster[k]||[],x=>x||''),T=Array.from(S.rosterTag[k]||[],x=>x||'');let add=0;

  S.roster[k]=L;S.rosterTag[k]=T;const filled=L.length;if(filled>nbJ(c,t))S.nbj[k]=Math.min(30,filled);S.rosterTs[k]=now();return add;}
function parseList(c,txt){return String(txt||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[;|\t]\s*/);return [p[0].replace(/^[-•*\d.)\s]+/,''),parseTag(c,p[1]||'')];}).filter(x=>x[0]);}
const nbJ=(c,t)=>{const v=+S.nbj[rkey(c,t)];return v>0?v:S.nbDef;};
const pname=(c,t,k)=>{const n=String(roster(c,t)[k-1]||'').trim();return n||`Joueur N°${k}`;};
const idxs=v=>String(v||'').split('/').map(x=>parseInt(x,10)).filter(x=>x>0);
const pnames=(c,t,v)=>idxs(v).map(k=>pname(c,t,k)).join(' / ');
function nameToIdx(c,t,name){name=String(name||'').trim();if(!name||/^\d+$/.test(name))return name;
  const L=S.roster[rkey(c,t)]=roster(c,t).slice();let k=L.findIndex(x=>String(x||'').trim().toLowerCase()===name.toLowerCase());
  if(k<0){const lim=Math.max(L.length,nbJ(c,t));k=0;while(k<lim&&String(L[k]||'').trim())k++;L[k]=name;}
  if(k+1>nbJ(c,t))S.nbj[rkey(c,t)]=k+1;return String(k+1);}
const legacyToIdx=(c,t,v)=>{const a=String(v||'').split('/').map(x=>x.trim());if(a.every(x=>/^\d*$/.test(x)))return String(v||'');return a.map(x=>nameToIdx(c,t,x)).join('/');};
function pSelect(m,t,val,k,lab){const c=m.cat,n=Math.max(nbJ(c,t),parseInt(val,10)||0);let o=`<option value="">${h(lab)}</option>`;
  const opt=i=>`<option value="${i}"${String(val)===String(i)?' selected':''}>${h(pname(c,t,i))}${ptag(c,t,i)?' · '+h(tagLabel(ptag(c,t,i))):''}</option>`;
  const idx=Array.from({length:n},(_,i)=>i+1);
  if(idx.some(i=>ptag(c,t,i))){const groups=[...tagOpts(c),''];groups.forEach(g=>{const ii=idx.filter(i=>(ptag(c,t,i)||'')===g||(!g&&!tagOpts(c).includes(ptag(c,t,i))));if(ii.length)o+=`<optgroup label="${g?h(tagLabel(g,true)):'Sans précision'}">${ii.map(opt).join('')}</optgroup>`;});}
  else idx.forEach(i=>o+=opt(i));
  return `<select data-id="${m.id}" data-k="${k}" aria-label="${h(lab)}">${o}</select>`;}
function playerStats(cat){const P=PL(cat),R={},PR={};
  const ms=[...cat.matches].sort((a,b)=>DATES.indexOf(a.date)-DATES.indexOf(b.date));
  if(cat.type==='2P'){const F=finals(cat);[F.sf1,F.sf2,F.f].forEach(m=>{if(m.t1&&m.t2)ms.push(m);});}
  ms.forEach(m=>{const r=S.res[m.id];if(!r||r.wo)return;P.forEach((lab,i)=>{const sc=(r.p||[])[i],st=partie(sc),nm=(r.n||[])[i];if(!st||!st.w||!nm)return;
    const sets=parseSets(sc),dbl=/double/i.test(lab);
    [[m.t1,nm[0],1],[m.t2,nm[1],2]].forEach(([t,v,side])=>{const ks=idxs(v);if(!ks.length)return;const won=st.w===side;
      const sW=side===1?st.s1:st.s2,sL=side===1?st.s2:st.s1;
      const lostFirst=sets.length>1&&(side===1?sets[0][0]<sets[0][1]:sets[0][1]<sets[0][0]);
      const bagel=sets.some(([a,b],j)=>!(j>=2&&Math.max(a,b)>=10)&&(side===1?a===6&&b===0:b===6&&a===0));
      ks.forEach(k=>{const key=t+'|'+k;const o=R[key]=R[key]||{t,k,n:pname(cat,t,k),tg:ptag(cat,t,k),sv:0,sd:0,dv:0,dd:0,sw:0,sl:0,cur:0,best:0,cb:0,bg:0,b:[]};
        if(dbl){won?o.dv++:o.dd++;}else{won?o.sv++:o.sd++;}o.sw+=sW;o.sl+=sL;
        if(won){o.cur++;o.best=Math.max(o.best,o.cur);if(lostFirst)o.cb++;}else o.cur=0;if(won&&bagel)o.bg++;});
      if(dbl&&ks.length===2){const pk=t+'|'+ks.slice().sort((a,b)=>a-b).join('/');const q=PR[pk]=PR[pk]||{t,n:ks.map(k=>pname(cat,t,k)).join(' / '),v:0,d:0};won?q.v++:q.d++;}});});});
  const rows=Object.values(R).sort((a,b)=>(b.sv+b.dv)-(a.sv+a.dv)||(a.sd+a.dd)-(b.sd+b.dd)||(b.sw-b.sl)-(a.sw-a.sl)||a.n.localeCompare(b.n));
  if(rows[0]&&rows[0].sv+rows[0].dv>0)rows[0].mvp=1;
  rows.forEach(o=>{const V=o.sv+o.dv,D=o.sd+o.dd;
    if(o.mvp)o.b.push(['🏅','Meilleur joueur de la catégorie']);
    if(V>=2&&D===0)o.b.push(['🛡️','Invaincu']);
    if(o.best>=3)o.b.push(['🔥',`Série de ${o.best} parties gagnées`]);
    if(o.cb)o.b.push(['💪','Retour gagnant : partie gagnée après un 1er set perdu']);
    if(o.bg)o.b.push(['🥯','Set gagné 6-0']);});
  rows.pairs=Object.values(PR).sort((a,b)=>b.v-a.v||a.d-b.d||a.n.localeCompare(b.n));
  return rows;}
function awardItems(cat){const ps=playerStats(cat),it=[];
  const mvp=ps.find(o=>o.mvp);if(mvp)it.push(['🏅','Meilleur joueur',mvp.n,mvp.t,`${mvp.sv+mvp.dv} partie(s) gagnée(s), ${mvp.sd+mvp.dd} perdue(s)`]);
  const pr=ps.pairs[0];if(pr&&pr.v)it.push(['🤝','Meilleure paire de double',pr.n,pr.t,`${pr.v} victoire(s), ${pr.d} défaite(s)`]);
  Object.keys(cat.poules).forEach(pl=>standings(cat,pl).rows.forEach(r=>{if(r.V>=2&&r.D===0)it.push(['⭐','Équipe invaincue',r.t,'',`${r.V} rencontres gagnées sur ${r.J}`]);}));
  const sk=ps.filter(o=>o.best>=3).sort((a,b)=>b.best-a.best)[0];if(sk)it.push(['🔥','Plus longue série',sk.n,sk.t,`${sk.best} parties gagnées d'affilée`]);
  const cb=ps.filter(o=>o.cb).sort((a,b)=>b.cb-a.cb)[0];if(cb)it.push(['💪','Roi du retour',cb.n,cb.t,`${cb.cb} partie(s) gagnée(s) après un 1er set perdu`]);
  const bg=ps.filter(o=>o.bg).sort((a,b)=>b.bg-a.bg)[0];if(bg)it.push(['🥯','Roue de vélo',bg.n,bg.t,`${bg.bg} partie(s) avec un set gagné 6-0`]);
  return it;}

/* ============ CALCULS ============ */
function parseSets(str){const sets=[];if(!str)return sets;
  String(str).replace(/\(.*?\)/g,' ').split(/[\s,;]+/).forEach(tok=>{const m=tok.match(/^(\d{1,2})[-\/:](\d{1,2})$/);if(m)sets.push([+m[1],+m[2]]);});return sets;}
function partie(str,need,isX){const s=parseSets(str);if(!s.length)return null;let s1=0,s2=0,j1=0,j2=0;
  s.forEach(([a,b],i)=>{if(a>b)s1++;else if(b>a)s2++;
    if((isX||i>=2)&&Math.max(a,b)>=10){if(a>b)j1++;else if(b>a)j2++;} else {j1+=a;j2+=b;}});
  const nd=need||2;return {s1,s2,j1,j2,w:s1>=nd&&s1>s2?1:s2>=nd&&s2>s1?2:0};}
function evalR(r,c,id){c=c||catOfId(id)||CATS[0];const P=parts(c),n=P.length,tot=P.reduce((a,x)=>a+x.pts,0),ko=isKO(id);
  const z={any:false,done:false,w:0,p1:0,p2:0,s1:0,s2:0,j1:0,j2:0,wo:0,draw:false,dec:0,n,tot,x:false};if(!r)return z;
  if(r.wo==='1'||r.wo==='2'){const w=+r.wo;return Object.assign(z,{any:true,done:true,w,wo:w,dec:n,p1:w===1?tot:0,p2:w===2?tot:0,s1:w===1?2*n:0,s2:w===2?2*n:0,j1:w===1?12*n:0,j2:w===2?12*n:0});}
  let rem=0;
  P.forEach((x,i)=>{const st=partie((r.p||[])[i]);if(st){z.any=true;z.s1+=st.s1;z.s2+=st.s2;z.j1+=st.j1;z.j2+=st.j2;}
    if(st&&st.w){z.dec++;if(st.w===1)z.p1+=x.pts;else z.p2+=x.pts;}else rem+=x.pts;});
  if(z.p1>z.p2+rem)z.w=1;else if(z.p2>z.p1+rem)z.w=2;
  else if(rem===0){if(ko){z.x=true;const st=partie((r.p||[])[n],1,true);if(st){z.any=true;z.s1+=st.s1;z.s2+=st.s2;z.j1+=st.j1;z.j2+=st.j2;if(st.w)z.w=st.w;}}else z.draw=true;}
  z.done=z.draw||(z.w>0&&(ko||rem===0));return z;}
const ev=id=>evalR(S.res[id],catOfId(id),id);

function standings(cat,pl){
  const R={};cat.poules[pl].forEach(t=>R[t]={t,J:0,V:0,N:0,D:0,F:0,P:0,pp:0,pc:0,sp:0,sc:0,jp:0,jc:0});
  const ms=cat.matches.filter(m=>m.poule===pl);let done=0;const hw={};
  ms.forEach(m=>{const e=ev(m.id);if(!e.done)return;done++;const a=R[m.t1],b=R[m.t2];a.J++;b.J++;
    if(e.draw){a.N++;b.N++;hw[m.t1+'|'+m.t2]=hw[m.t2+'|'+m.t1]='=';}
    else{const W=e.w===1?a:b,L=e.w===1?b:a;W.V++;if(e.wo)L.F++;else L.D++;hw[m.t1+'|'+m.t2]=hw[m.t2+'|'+m.t1]=W.t;}
    a.pp+=e.p1;a.pc+=e.p2;b.pp+=e.p2;b.pc+=e.p1;a.sp+=e.s1;a.sc+=e.s2;b.sp+=e.s2;b.sc+=e.s1;a.jp+=e.j1;a.jc+=e.j2;b.jp+=e.j2;b.jc+=e.j1;});
  const rows=Object.values(R);rows.forEach(r=>r.P=3*r.V+2*r.N+r.D-r.F);
  const cnt={};rows.forEach(r=>cnt[r.P]=(cnt[r.P]||0)+1);
  const pct=(a,b)=>a+b?a/(a+b):0,h2h=(x,y)=>{const w=hw[x.t+'|'+y.t];return w&&w!=='='?(w===x.t?-1:1):0;};
  rows.sort((x,y)=>y.P-x.P||(cnt[x.P]===2?h2h(x,y):0)||((y.pp-y.pc)-(x.pp-x.pc))||(pct(y.sp,y.sc)-pct(x.sp,x.sc))||(pct(y.jp,y.jc)-pct(x.jp,x.jc))||h2h(x,y)||x.t.localeCompare(y.t));
  const prog=[];ms.forEach(m=>{const e=ev(m.id);if(e.any&&!e.done){prog.push(m);R[m.t1].lv=(R[m.t1].lv||[]).concat(`${e.p1}-${e.p2} contre ${m.t2}`);R[m.t2].lv=(R[m.t2].lv||[]).concat(`${e.p2}-${e.p1} contre ${m.t1}`);}});
  return {rows,complete:done===ms.length,done,total:ms.length,prog:prog.length};
}
function finals(cat){if(cat.type!=='2P')return null;
  const A=standings(cat,'A'),B=standings(cat,'B');
  const slot=(st,k,l)=>({l,t:st.complete?st.rows[k].t:null,prov:st.done?st.rows[k].t:null});
  const mk=(sfx,a,b,tag)=>({id:cat.id+'-'+sfx,cat,poule:sfx,tag,t1:a.t,t2:b.t,l1:a.l,l2:b.l,p1:a.prov,p2:b.prov});
  const win=m=>{if(!m.t1||!m.t2)return null;const e=ev(m.id);return e.done?(e.w===1?m.t1:m.t2):null;};
  const sf1=mk('SF1',slot(A,0,'A1'),slot(B,1,'B2'),'Demi-finale 1'),sf2=mk('SF2',slot(A,1,'A2'),slot(B,0,'B1'),'Demi-finale 2');
  const f=mk('F',{l:'Vainq. DF1',t:win(sf1)},{l:'Vainq. DF2',t:win(sf2)},'Finale');
  const champ=win(f);return {A,B,sf1,sf2,f,champ,fin:champ?(champ===f.t1?f.t2:f.t1):null};}
function getMatch(id){const m=id.match(/^(\w+)-(SF1|SF2|F)$/);if(m){const F=finals(CATMAP[m[1]]);return {SF1:F.sf1,SF2:F.sf2,F:F.f}[m[2]];}return MATCH[id];}
function catProgress(c){const n=c.matches.filter(m=>ev(m.id).done).length;return [n,c.matches.length];}
function teamStatus(cat,t){
  const pl=Object.keys(cat.poules).find(k=>cat.poules[k].includes(t));const st=standings(cat,pl);const rank=st.rows.findIndex(r=>r.t===t)+1;
  if(cat.type==='1P'){if(st.complete)return rank===1?['Champion','gold']:rank===2?['Finaliste','silver']:[rank+'e de la poule','out'];
    return [st.done?`${rank}e (provisoire)`:'À jouer',''];}
  const F=finals(cat);
  if(F.champ===t)return['Champion','gold'];if(F.fin===t)return['Finaliste','silver'];
  if(F.f.t1===t||F.f.t2===t)return['En finale','ok'];
  const sf=[F.sf1,F.sf2].find(m=>m.t1===t||m.t2===t);
  if(sf)return ev(sf.id).done?['Demi-finaliste','out']:['Qualifié en ½ finale','ok'];
  if(st.complete)return['Éliminé en poule','out'];
  return [st.done?`Poule ${pl}, ${rank}e (provisoire)`:'À jouer',''];}

function updateCard(id){const el=main.querySelector(`[data-card="${id}"]`);if(!el)return;const m=getMatch(id);if(!m)return;
  const e=ev(id),r=S.res[id]||{p:[]};

    const L=S.live[id+'#'+sp.dataset.pr];if(L&&L.pts.length&&!e.wo){const Rr=replay(L);if(!Rr.w){sp.className='pr pend';sp.textContent='● En direct : '+liveTxt(L,Rr);}}});

const LIVE_STALE=30*60e3;

function cardWhen(m,when){const t=S.hours[m.id];if(!m.date)return (when||'Date à confirmer')+(t?' · '+fmtH(t):'');
  return venueName(when)+' · '+(t?'🕒 '+fmtH(t):'dès '+(hourOf(when)||'10h00'));}
function setHour(id,v){if(v)S.hours[id]=v;else delete S.hours[id];S.hoursTs[id]=now();save();}
const timeKey=(m,lieu)=>S.hours[m.id]||(hourOf(lieu)||'10h00').replace('h',':');
function utcRange(date,lieu,time){const iso=DAYISO[date];if(!iso)return null;const hh=time?fmtH(time):(hourOf(lieu)||'10h00');const [H,M]=hh.split('h').map(Number);
  const st=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10),H-(+S.tzOff||0),M));const en=new Date(st.getTime()+3*3600e3);
  const f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');return [f(st),f(en)];}
function evTitle(m,c){return `🎾 ${m.t1} – ${m.t2} (${catLabel(c)})`;}
function gcal(m,c,lieu){const r=utcRange(m.date,lieu,S.hours[m.id]);if(!r)return '';

  return `<a class="agcal" href="${h(u)}" target="_blank" rel="noopener" title="Ajouter à Google Agenda" aria-label="Ajouter à Google Agenda">📅</a>`;}
function downloadICS(){if(!S.myClub){toast('Choisissez d\'abord votre club');return;}
  const esc=t=>String(t).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FRMT26//Championnat jeunes//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+esc('Championnat jeunes · '+S.myClub)];let n=0;
  CATS.forEach(c=>c.matches.forEach(m=>{if(!(isMine(m.t1)||isMine(m.t2)))return;const r=utcRange(m.date,m.lieu,S.hours[m.id]);if(!r)return;n++;
    L.push('BEGIN:VEVENT','UID:'+m.id+'@frmt26-jeunes','DTSTAMP:'+stamp,'DTSTART:'+r[0],'DTEND:'+r[1],'SUMMARY:'+esc(evTitle(m,c)),'LOCATION:'+esc(venueName(m.lieu)),

function agCard({m,c,lieu}){if(S.calEdit&&canAdmin()&&m.date)return agEdit({m,c,lieu});const {k,e}=mState(m),mine=isMine(m.t1)||isMine(m.t2),ok=m.t1&&m.t2;

function clubStats(){const C={};
  const get=k=>C[k]=C[k]||{k,J:0,V:0,D:0,pp:0,pc:0,teams:[]};
  CATS.forEach(c=>{Object.values(c.poules).flat().forEach(t=>get(base(t)).teams.push({c,t,st:teamStatus(c,t)}));
    const ms=[...c.matches];if(c.type==='2P'){const F=finals(c);[F.sf1,F.sf2,F.f].forEach(m=>{if(m.t1&&m.t2)ms.push(m);});}
    ms.forEach(m=>{const e=ev(m.id);if(!e.done)return;const a=get(base(m.t1)),b=get(base(m.t2));a.J++;b.J++;
      if(e.draw){}else if(e.w===1){a.V++;b.D++;}else{b.V++;a.D++;}a.pp+=e.p1;a.pc+=e.p2;b.pp+=e.p2;b.pc+=e.p1;});});
  return C;}

let LIVE=null,WL=null;
async function wake(){try{WL=await navigator.wakeLock.request('screen');}catch(e){}}
function relWake(){try{WL&&WL.release();}catch(e){}WL=null;}
function replay(L){let sets=[],g=[0,0],p=[0,0],w=0;const TB=+L.tb||6,nd=L.one?1:2;
  const sw=()=>[0,1].map(k=>sets.filter(s=>s[k]>s[1-k]).length);
  const isSTB=()=>{const x=sw();return !!L.one||(!!L.stb&&sets.length===2&&x[0]===1&&x[1]===1);};
  for(const pt of L.pts){if(w)break;const i=pt-1,o=1-i,stb=isSTB(),tb=stb||(g[0]===TB&&g[1]===TB);p[i]++;
    if(tb){const tg=stb?10:7;if(p[i]>=tg&&p[i]-p[o]>=2){let s;if(stb){s=[p[0],p[1]];}else{s=[g[0],g[1]];s[i]++;s.tb=Math.min(p[0],p[1]);}sets.push(s);g=[0,0];p=[0,0];}}
    else if(L.noad?p[i]>=4:(p[i]>=4&&p[i]-p[o]>=2)){g[i]++;p=[0,0];if(g[i]>=6&&g[i]-g[o]>=2){sets.push([g[0],g[1]]);g=[0,0];}}
    const x=sw();if(x[0]===nd)w=1;else if(x[1]===nd)w=2;}
  const stb=!w&&isSTB();return {sets,g,p,w,stb,tb:!w&&(stb||(g[0]===TB&&g[1]===TB))};}
const scoreStr=R=>R.sets.map(s=>`${s[0]}-${s[1]}${s.tb!==undefined?'('+s.tb+')':''}`).join(' ');
function ptLabel(R,sd,L){const me=R.p[sd],ot=R.p[1-sd];if(R.tb)return String(me);
  if(!L.noad&&me>=3&&ot>=3)return me>ot?'AV':'40';return ['0','15','30','40'][Math.min(me,3)];}
function liveTxt(L,R){const cur=R.tb?`jeu décisif ${R.p[0]}-${R.p[1]}`:`${R.g[0]}-${R.g[1]} (${ptLabel(R,0,L)}-${ptLabel(R,1,L)})`;return [scoreStr(R),R.stb?`super tie-break ${R.p[0]}-${R.p[1]}`:cur].filter(Boolean).join(' · ');}
function openLive(id,i){const k=id+'#'+i,L0=S.live[k];

  {const pc=partOf(catOfId(id),+i);S.live[k]=L0||{pts:[],stb:pc.stb,noad:pc.noad,tb:pc.tb,one:!!pc.one,w:''};}fillPlanned(id,+i);S.live[k].own=S.devId;delete S.live[k].stop;LIVE={id,i};ovOpen('live');drawLive();wake();}
function drawLive(){const {id,i}=LIVE,m=getMatch(id),c=m.cat,L=S.live[id+'#'+i],R=replay(L);
  const lab=partOf(c,i).l,r=S.res[id]||{},nm=effN(m,i);

  let stt='';if(R.w)stt=`Partie gagnée par ${who[R.w-1]} : ${scoreStr(R)}. Score enregistré.`;
  else if(R.stb)stt='Super tie-break en 10 points';else if(R.tb)stt='Jeu décisif en 7 points';

   <div class="lopts"><label><input type="checkbox" data-lopt="stb"${L.stb?' checked':''}> 3e set en super tie-break</label><label><input type="checkbox" data-lopt="noad"${L.noad?' checked':''}> Point décisif à 40-40</label></div>
   <div class="lact"><button class="btn" data-lundo${L.pts.length?'':' disabled'}>↶ Annuler le dernier point</button><button class="btn" data-lreset${L.pts.length?'':' disabled'}>Recommencer la partie</button><button class="btn" data-lstop>⏹ Arrêter le direct</button></div>`}`;}

let QRT=null,QRC=null;
function qrSVG(txt){const q=qrcode(0,'L');q.addData(txt);q.make();return q.createSvgTag({cellSize:4,margin:4,scalable:true});}
function showQR(code,raw){if(!code&&!raw){toast('Aucun score saisi pour cette sélection');return;}
  const size=500,n=raw?1:Math.ceil(code.length/size),gid=Math.floor(Math.random()*46656).toString(36);
  const frames=raw?[raw]:Array.from({length:n},(_,k)=>`FRMT26Q:${k+1}/${n}:${gid}:${code.slice(k*size,(k+1)*size)}`);
  let k=0,play=n>1;ovOpen('qr');
  const draw=()=>{OV.innerHTML=`<div class="ov-h"><div><b style="color:#fff;font-size:15px">Partage par QR code</b><br>Sur l'autre téléphone : Partage &amp; PDF, Recevoir, Scanner un QR code.${n>1?' Laissez défiler : chaque code est lu au passage.':''}</div><button class="ov-x" data-ov="close">Fermer</button></div>
    <div class="qrbox">${qrSVG(frames[k])}</div>${n>1?`<div class="dots">${frames.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>
    <div class="qrnav"><button class="btn" data-qr="prev" aria-label="Code précédent">‹</button><span>Code ${k+1} / ${n}</span><button class="btn" data-qr="play">${play?'Pause':'Lecture'}</button><button class="btn" data-qr="next" aria-label="Code suivant">›</button></div>`:''}
    <p class="legend" style="color:#c9d3de;text-align:center">Montez la luminosité de l'écran pour faciliter la lecture.</p>`;};
  QRC={next(){k=(k+1)%n;draw();},prev(){k=(k-1+n)%n;draw();},play(){play=!play;draw();}};
  draw();clearInterval(QRT);QRT=setInterval(()=>{if(play){k=(k+1)%n;draw();}},1300);}

/* ----- QR code : lire ----- */
const SCAN={stream:null,raf:0,busy:false,det:null};let RX={gid:'',n:0,parts:{},done:false};
function newDetector(){try{return 'BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;}catch(e){return null;}}
async function openScan(){RX={gid:'',n:0,parts:{},done:false};ovOpen('scan');
  OV.innerHTML=`<div class="ov-h"><div><b style="color:#fff;font-size:15px">Scanner un QR code</b><br>Visez le QR code affiché sur l'autre téléphone.</div><button class="ov-x" data-ov="close">Fermer</button></div>
   <video playsinline muted></video><div class="dots" id="rxdots"></div><div class="lstat" id="rxstat">Recherche d'un code…</div>`;
  const v=OV.querySelector('video');SCAN.det=newDetector();
  try{SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=SCAN.stream;await v.play();}
  catch(e){const s=document.getElementById('rxstat');if(s)s.textContent="Caméra inaccessible. Autorisez la caméra pour cette page, ou utilisez « Depuis une photo ».";return;}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(OVMODE!=='scan')return;
    if(!SCAN.busy&&v.readyState>=2&&v.videoWidth){SCAN.busy=true;try{
      if(SCAN.det){const r=await SCAN.det.detect(v);r.forEach(x=>gotQR(x.rawValue));}
      else{const w=Math.min(720,v.videoWidth),hh=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=hh;cx.drawImage(v,0,0,w,hh);
        const q=jsQR(cx.getImageData(0,0,w,hh).data,w,hh,{inversionAttempts:'dontInvert'});if(q)gotQR(q.data);}
    }catch(e){}SCAN.busy=false;}
    if(OVMODE==='scan')SCAN.raf=requestAnimationFrame(tick);};
  tick();}
function stopScan(){cancelAnimationFrame(SCAN.raf);if(SCAN.stream)SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null;}
function rxProgress(){const got=Object.keys(RX.parts).length,d=document.getElementById('rxdots'),s=document.getElementById('rxstat');
  if(d)d.innerHTML=Array.from({length:RX.n},(_,j)=>`<i class="${RX.parts[j+1]?'on':''}"></i>`).join('');
  if(s)s.textContent=`${got} code${got>1?'s':''} lu${got>1?'s':''} sur ${RX.n}`;return got;}
function gotQR(txt){txt=String(txt||'').trim();if(RX.done)return;
  if(/^FRMT26S?:/.test(txt)){finishScan(txt);return;}
  const m=txt.match(/^FRMT26Q:(\d+)\/(\d+):(\w+):([A-Za-z0-9.\-]+)$/);if(!m)return;
  if(RX.gid!==m[3])RX={gid:m[3],n:+m[2],parts:{},done:false};
  if(!RX.parts[m[1]]){RX.parts[m[1]]=m[4];try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}}
  if(rxProgress()===RX.n)finishScan('FRMT26:'+Array.from({length:RX.n},(_,j)=>RX.parts[j+1]).join(''));}
function finishScan(txt){RX.done=true;if(OVMODE)ovClose();if(!S.onboarded&&/FRMT26S:/.test(txt)){const r=importText(txt);if(r&&r.syncCfg){showWelcome('profile');return;}}S.tab='share';save();render();showImport(txt);}
async function scanPhoto(file){if(!file)return;const img=new Image();img.src=URL.createObjectURL(file);try{await img.decode();}catch(e){}
  let txt=null;const det=newDetector();try{if(det){const r=await det.detect(img);if(r[0])txt=r[0].rawValue;}}catch(e){}
  if(!txt&&img.naturalWidth){const w=Math.min(1400,img.naturalWidth),hh=Math.round(img.naturalHeight*w/img.naturalWidth);const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
    const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,hh);const q=jsQR(cx.getImageData(0,0,w,hh).data,w,hh);if(q)txt=q.data;}
  URL.revokeObjectURL(img.src);
  if(!txt){toast('Aucun QR code reconnu sur cette photo');return;}
  if(RX.done)RX={gid:'',n:0,parts:{},done:false};gotQR(txt);
  if(!RX.done&&RX.n)toast(`Code ${Object.keys(RX.parts).length} sur ${RX.n} lu. Photographiez le suivant.`);}

/* ----- Synchronisation via Google Sheets ----- */
const GS_CODE="/*  Championnat du Maroc par équipes des jeunes, saison 2025/2026\n    Serveur de synchronisation des résultats (Google Apps Script), version 7\n    Suivi des appareils connectés et de l'auteur de chaque saisie.\n    Profil juge-arbitre par lieu (écriture limitée aux rencontres de son lieu) : validation des rencontres de son lieu.\n    Fusion partie par partie, horodatage serveur, journal des conflits, parties terminées\n    modifiables uniquement par l'organisateur.\n\n    1. Choisissez trois codes différents ci-dessous :\n       - CODE_ADMIN        : organisateur (vous seul) : tous les droits, réinitialisation, horaires\n       - CODE_SAISIE       : responsables de club : scores, joueurs, comptage en direct\n       - CODE_CONSULTATION : parents et public : lecture seule\n    2. Enregistrez, puis Déployer > Gérer les déploiements > ✏️ > Version : Nouvelle version\n       (ou Nouveau déploiement > Application Web · Exécuter en tant que : Moi · Accès : Tout le monde).\n    3. Dans l'appli, connectez-vous en organisateur avec CODE_ADMIN : les invitations\n       Saisie et Consultation sont ensuite générées automatiquement.\n    Le script fonctionne attaché à une feuille ou seul (script.google.com) : dans ce cas il crée\n    lui-même la feuille « Championnat jeunes FRMT 2025-2026 – Résultats » dans votre Drive.   */\n\nvar CODE_ADMIN = 'CHANGEZ-ADMIN';\nvar CODE_SAISIE = 'CHANGEZ-SAISIE';\nvar CODE_CONSULTATION = 'CHANGEZ-CONSULTATION';\n\n// Lieux des rencontres (programme FRMT) : [nombre de rencontres de la poule A, lieu A, lieu B]\nvar LIEUX = { u12d1: [3, 'RTCMO', 'LANORIA'], u12d2: [99, 'COC'], f14d1: [99, 'RUC'], f14d2: [99, 'ACSA'],\n  g14d1: [6, 'RUC', 'BP'], g14d2: [3, 'RTCMO', 'OCC'], f18d1: [99, 'ABC'], f18d2: [99, 'ACSA'],\n  g18d1: [6, 'CMC', 'ASAS'], g18d2: [6, 'OCC', 'USM/TCC'] };\nfunction lieu_(id) {\n  var p = String(id).split('-'), t = LIEUX[p[0]];\n  if (!t) return '';\n  if (!/^\\d+$/.test(p[1])) return '*';            // phases finales : tout juge-arbitre\n  return Number(p[1]) < t[0] ? t[1] : (t[2] || t[1]);\n}\nfunction lieux_() { var o = {}; Object.keys(LIEUX).forEach(function (k) { o[LIEUX[k][1]] = 1; if (LIEUX[k][2]) o[LIEUX[k][2]] = 1; }); return Object.keys(o).sort(); }\n// Code juge-arbitre d'un lieu, dérivé du code organisateur (changer CODE_ADMIN change aussi ces codes)\nfunction codeJA_(lieu) {\n  var d = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, CODE_ADMIN + '|JA|' + lieu), h = '';\n  for (var i = 0; i < 4; i++) h += ('0' + ((d[i] + 256) % 256).toString(16)).slice(-2);\n  return 'JA-' + lieu.replace(/[^A-Za-z]/g, '') + '-' + h.toUpperCase();\n}\n\nfunction role_(k, lieu) {\n  k = String(k || '');\n  if (!k) return '';\n  if (lieu && k === codeJA_(String(lieu))) return 'ja';\n  if (k === CODE_ADMIN) return 'admin';\n  if (k === CODE_SAISIE) return 'saisie';\n  if (k === CODE_CONSULTATION) return 'lecture';\n  return '';\n}\n\nfunction doGet() {\n  return json_({ ok: true, app: 'FRMT26', version: 7, now: Date.now(), feuille: classeur_().getUrl() });\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    var b = JSON.parse(e.postData.contents);\n    if (/^CHANGEZ/.test(CODE_ADMIN) || /^CHANGEZ/.test(CODE_SAISIE) || /^CHANGEZ/.test(CODE_CONSULTATION) ||\n        CODE_ADMIN === CODE_SAISIE || CODE_ADMIN === CODE_CONSULTATION || CODE_SAISIE === CODE_CONSULTATION)\n      return json_({ ok: false, error: 'Les trois codes du script ne sont pas encore définis (ou sont identiques)' });\n    var role = role_(b.key, b.venue);\n    if (!role) return json_({ ok: false, error: \"Code d'accès incorrect\" });\n    if (role === 'lecture') { b.results = []; b.roster = []; b.live = []; }\n    if (role !== 'admin') b.fin = [];\n    if (role === 'ja') b.roster = [];\n    var codes = null;\n    if (role === 'admin') { var ja = {}; lieux_().forEach(function (l) { ja[l] = codeJA_(l); }); codes = { saisie: CODE_SAISIE, lecture: CODE_CONSULTATION, ja: ja }; }\n    var ss = classeur_();\n    var now = Date.now();\n    var pres = presence_(b, role, now);\n    if (b.action === 'live') return json_({ ok: true, version: 7, role: role, now: now, live: direct_(b.live || [], now), presence: role === 'admin' ? pres : null });\n    var par = String(b.device || '').slice(0, 60) + ' [' + role + ']';\n    appareil_(ss, b, role, now);\n    var props = PropertiesService.getScriptProperties();\n    if (role === 'admin' && Number(b.need) > 0) props.setProperty('NEED', String(Number(b.need)));\n    var need = Number(props.getProperty('NEED')) || 2;\n    var R = feuille_(ss, 'Résultats', ['Rencontre', 'Score']);\n    var E = feuille_(ss, 'Effectifs', ['Équipe', 'Joueurs']);\n    var F = feuille_(ss, 'Finales', ['Date et lieu']);\n    var notes = [], journal = [];\n    (b.results || []).forEach(function (x) { if (x) x.dev = String(b.devId || ''); });\n    var touches = resultats_(R, b.results || [], role, par, now, need, notes, journal, String(b.venue || ''));\n    if (journal.length) journal_(ss, journal);\n    ecrire_(E, (b.roster || []).map(function (x) {\n      return { id: x.k, ts: x.ts, cols: [x.label || '', (x.names || []).join(', ')], data: x };\n    }), now, par);\n    ecrire_(F, (b.fin || []).map(function (x) {\n      return { id: x.k, ts: x.ts, cols: [x.v || ''], data: x };\n    }), now, par);\n    var since = Number(b.since) || 0;\n    var res = lire_(R, since, 2), vus = {};\n    res.forEach(function (x) { if (x && x.id) vus[x.id] = 1; });\n    touches.forEach(function (x) { if (!vus[x.id]) res.push(x); });\n    return json_({ ok: true, version: 7, role: role, codes: codes, now: now, need: need, notes: notes,\n      journal: role === 'admin' ? dernier_(ss) : null, presence: role === 'admin' ? pres : null, results: res, roster: lire_(E, since, 2), fin: lire_(F, since, 1), live: direct_(b.live || [], now) });\n  } catch (err) {\n    return json_({ ok: false, error: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction classeur_() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (ss) return ss;\n  var props = PropertiesService.getScriptProperties();\n  var id = props.getProperty('FEUILLE_ID');\n  if (id) return SpreadsheetApp.openById(id);\n  ss = SpreadsheetApp.create('Championnat jeunes FRMT 2025-2026 – Résultats');\n  props.setProperty('FEUILLE_ID', ss.getId());\n  return ss;\n}\n\n// Résultats : une ligne par rencontre, fusion partie par partie (unité 0, 1, 2… = partie, w = forfait)\nfunction resultats_(sh, items, role, par, now, need, notes, journal, venue) {\n  if (!items.length) return [];\n  var W = 8, n = sh.getLastRow();\n  var vals = n > 1 ? sh.getRange(2, 1, n - 1, W).getValues() : [], n0 = vals.length;\n  var index = {}, touches = [];\n  for (var i = 0; i < vals.length; i++) index[vals[i][0]] = i;\n  items.forEach(function (it) {\n    if (!it || !it.id) return;\n    var i = index[it.id], rec = null;\n    if (i !== undefined) { try { rec = JSON.parse(vals[i][7]); } catch (e) { rec = null; } }\n    rec = normRec_(rec, it.id);\n    if (fusion_(rec, it, role, par, now, need, notes, journal, venue)) {\n      var ligne = [it.id, it.label || '', it.score || '', new Date(now), par, now, now, JSON.stringify(rec)];\n      if (i === undefined) { index[it.id] = vals.length; vals.push(ligne); }\n      else { vals[i] = ligne; if (i < n0) sh.getRange(i + 2, 1, 1, W).setValues([ligne]); }\n    }\n    touches.push(rec);\n  });\n  if (vals.length > n0) sh.getRange(n0 + 2, 1, vals.length - n0, W).setValues(vals.slice(n0));\n  return touches;\n}\n\nfunction normRec_(d, id) {\n  if (d && !Array.isArray(d) && d.u) return d;\n  var rec = { id: id, u: {} };\n  if (Array.isArray(d)) {\n    var p = d[1] || [], n = d[4] || [], ts = (Number(d[3]) || 0) * 1000;\n    for (var i = 0; i < p.length; i++) rec.u[String(i)] = { v: [String(p[i] || ''), String((n[i] || [])[0] || ''), String((n[i] || [])[1] || '')], ts: ts, by: '' };\n    if (d[2]) rec.u.w = { v: [String(d[2])], ts: ts, by: '' };\n  }\n  return rec;\n}\n\nfunction fusion_(rec, it, role, par, now, need, notes, journal, venue) {\n  var change = false, lieu = lieu_(rec.id), dev = String(it.dev || '');\n  var pouvoir = role === 'admin' || (role === 'ja' && (lieu === '*' || lieu === venue));\n  var valide = function () { return !!(rec.u.v && rec.u.v.v && rec.u.v.v[0]); };\n  (it.u || []).forEach(function (x) {\n    var k = String(x.k), nv = (x.v || []).map(function (s) { return String(s || '').trim(); }), cur = rec.u[k];\n    if (cur && JSON.stringify(cur.v) === JSON.stringify(nv)) return;\n    if (!cur && nv.join('') === '') return;\n    var nom = k === 'w' ? 'Forfait' : k === 'v' ? 'Validation' : 'Partie ' + (Number(k) + 1);\n    var avant = cur ? txt_(cur.v) : '(vide)';\n    if (role === 'ja' && !pouvoir) {\n      notes.push({ id: rec.id, k: k, st: 'refus' });\n      journal.push([new Date(now), it.label || rec.id, nom, avant, txt_(nv), par, 'Refusé : rencontre hors du lieu du juge-arbitre (' + venue + ')']);\n      return;\n    }\n    if (k === 'v' && !pouvoir) {\n      notes.push({ id: rec.id, k: k, st: 'refus' });\n      journal.push([new Date(now), it.label || rec.id, 'Validation', avant, txt_(nv), par, 'Refusé : validation réservée au juge-arbitre du lieu (' + lieu + \") ou à l'organisateur\"]);\n      return;\n    }\n    if (k !== 'v' && valide() && !pouvoir) {\n      notes.push({ id: rec.id, k: k, st: 'refus' });\n      journal.push([new Date(now), it.label || rec.id, nom, avant, txt_(nv), par, 'Refusé : rencontre validée par le juge-arbitre']);\n      return;\n    }\n    if (k === 'v') {\n      journal.push([new Date(now), it.label || rec.id, 'Validation', avant, txt_(nv), par, nv[0] ? 'Rencontre validée' : 'Validation annulée']);\n      rec.u[k] = { v: nv, ts: now, by: par, dev: dev }; change = true; return;\n    }\n    if (cur && !pouvoir && termine_(k, cur.v, need)) {\n      notes.push({ id: rec.id, k: k, st: 'refus' });\n      journal.push([new Date(now), it.label || rec.id, nom, avant, txt_(nv), par, \"Refusé : partie terminée, modification réservée au juge-arbitre ou à l'organisateur\"]);\n      return;\n    }\n    if (cur && (Number(cur.ts) || 0) > (Number(x.base) || 0) && cur.by !== par) {\n      notes.push({ id: rec.id, k: k, st: 'conflit', by: cur.by });\n      journal.push([new Date(now), it.label || rec.id, nom, avant, txt_(nv), par, 'Conflit : saisie simultanée, dernière arrivée retenue (précédente : ' + (cur.by || '?') + ')']);\n    } else if (cur && termine_(k, cur.v, need)) {\n      journal.push([new Date(now), it.label || rec.id, nom, avant, txt_(nv), par, role === 'ja' ? 'Corrigé par le juge-arbitre' : \"Corrigé par l'organisateur\"]);\n    }\n    rec.u[k] = { v: nv, ts: now, by: par, dev: dev };\n    change = true;\n  });\n  return change;\n}\n\nfunction termine_(k, v, need) {\n  if (k === 'w' || k === 'v') return !!(v && v[0]);\n  var a = 0, b = 0;\n  String((v || [])[0] || '').replace(/\\([^)]*\\)/g, ' ').split(/[\\s,;]+/).forEach(function (t) {\n    var m = t.match(/^(\\d{1,2})[-\\/:](\\d{1,2})$/);\n    if (m) { if (+m[1] > +m[2]) a++; else if (+m[2] > +m[1]) b++; }\n  });\n  return Math.max(a, b) >= need;\n}\n\nfunction txt_(v) { var t = (v || []).filter(function (x) { return x; }).join(' · '); return t || '(vide)'; }\n\nfunction journal_(ss, rows) {\n  var sh = ss.getSheetByName('Journal');\n  if (!sh) {\n    sh = ss.insertSheet('Journal');\n    sh.appendRow(['Date', 'Rencontre', 'Partie', 'Avant', 'Après', 'Par', 'Décision']);\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, 7).setFontWeight('bold');\n  }\n  sh.getRange(sh.getLastRow() + 1, 1, rows.length, 7).setValues(rows);\n}\n\nfunction dernier_(ss) {\n  var sh = ss.getSheetByName('Journal');\n  if (!sh || sh.getLastRow() < 2) return [];\n  var n = sh.getLastRow(), k = Math.min(40, n - 1);\n  return sh.getRange(n - k + 1, 1, k, 7).getValues().reverse();\n}\n\n// Appareils : présence en temps réel (cache) et registre permanent (onglet « Appareils »)\nfunction presence_(b, role, now) {\n  var cache = CacheService.getScriptCache(), map = {};\n  try { map = JSON.parse(cache.get('presence') || '{}'); } catch (e) { map = {}; }\n  var id = String(b.devId || '');\n  if (id) map[id] = { n: String(b.device || '').slice(0, 60), r: role, v: String(b.venue || ''), c: String(b.club || '').slice(0, 30), t: now };\n  Object.keys(map).forEach(function (k) { if (now - (Number(map[k].t) || 0) > 24 * 3600000) delete map[k]; });\n  cache.put('presence', JSON.stringify(map), 21600);\n  return map;\n}\nfunction appareil_(ss, b, role, now) {\n  var id = String(b.devId || '');\n  if (!id) return;\n  var sh = feuille_(ss, 'Appareils', ['Nom', 'Profil', 'Lieu ou club']);\n  ecrire_(sh, [{ id: id, ts: now, cols: [String(b.device || ''), role, String(b.venue || b.club || '')], data: { n: b.device || '', r: role, t: now } }], now, String(b.device || ''));\n}\n\n// Colonnes : Clé | colonnes lisibles | Modifié le | Par | (masquées : horodatage, reçu, données)\nfunction feuille_(ss, nom, cols) {\n  var sh = ss.getSheetByName(nom);\n  if (!sh) {\n    sh = ss.insertSheet(nom);\n    sh.appendRow(['Clé'].concat(cols, ['Modifié le', 'Par', 'Horodatage', 'Reçu', 'Données']));\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, cols.length + 6).setFontWeight('bold');\n    sh.hideColumns(cols.length + 4, 3);\n  }\n  return sh;\n}\n\nfunction ecrire_(sh, items, now, par) {\n  if (!items.length) return;\n  var nc = sh.getLastColumn() - 6;\n  var n = sh.getLastRow();\n  var vals = n > 1 ? sh.getRange(2, 1, n - 1, nc + 6).getValues() : [];\n  var index = {}, nidx = {}, nouveaux = [];\n  for (var i = 0; i < vals.length; i++) index[vals[i][0]] = i;\n  items.forEach(function (it) {\n    if (!it.id) return;\n    var ts = Number(it.ts) || 0;\n    var ligne = [it.id].concat(it.cols, [new Date(), par, ts, now, JSON.stringify(it.data)]);\n    var i = index[it.id];\n    if (i !== undefined) {\n      if ((Number(vals[i][nc + 3]) || 0) < ts) {\n        sh.getRange(i + 2, 1, 1, nc + 6).setValues([ligne]);\n        vals[i] = ligne;\n      }\n    } else if (nidx[it.id] !== undefined) {\n      if (nouveaux[nidx[it.id]][nc + 3] < ts) nouveaux[nidx[it.id]] = ligne;\n    } else {\n      nidx[it.id] = nouveaux.length;\n      nouveaux.push(ligne);\n    }\n  });\n  if (nouveaux.length) sh.getRange(n + 1, 1, nouveaux.length, nc + 6).setValues(nouveaux);\n}\n\nfunction lire_(sh, since, nc) {\n  var n = sh.getLastRow();\n  if (n < 2) return [];\n  var v = sh.getRange(2, 1, n - 1, nc + 6).getValues(), out = [];\n  for (var i = 0; i < v.length; i++) {\n    if (Number(v[i][nc + 4]) > since) {\n      try { out.push(JSON.parse(v[i][nc + 5])); } catch (e) {}\n    }\n  }\n  return out;\n}\n\n// Scores en direct : une entrée par partie en cours, conservée 3 h (30 min une fois terminée)\nfunction direct_(items, now) {\n  var cache = CacheService.getScriptCache();\n  var map = {};\n  try { map = JSON.parse(cache.get('direct') || '{}'); } catch (e) { map = {}; }\n  items.forEach(function (x) {\n    if (x && x.k && (!map[x.k] || (Number(map[x.k].ts) || 0) < (Number(x.ts) || 0))) map[x.k] = x;\n  });\n  Object.keys(map).forEach(function (k) {\n    var x = map[k];\n    if (now - (Number(x.ts) || 0) > (x.d ? 30 : 180) * 60000) delete map[k];\n  });\n  cache.put('direct', JSON.stringify(map), 21600);\n  return map;\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";

function applyHashInvite(){const hs=decodeURIComponent(String(location.hash||''));const m=hs.match(/(FRMT26S:[A-Za-z0-9.\-]+)/);if(!m)return false;
  let c;try{c=dec(m[1].slice(8));}catch(e){return false;}if(!c||!c.u||!c.k)return false;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(S.sync.url===c.u&&S.sync.key===c.k&&(S.sync.venue||'')===(c.v||''))return false;
  if(syncReady()&&S.onboarded&&!confirm(`Ce lien contient une configuration « ${roleName(c.r)} ». Remplacer la configuration actuelle de cet appareil ?`))return false;
  S.sync.url=c.u;S.sync.key=c.k;S.sync.role=c.r||'';S.sync.venue=c.v||'';S.sync.codes=null;S.sync.auto=true;S.sync.pullAt=0;S.sync.err='';S.onboarded=false;save();return true;}
function applyPreset(){const el=document.getElementById('preset');if(!el)return false;let p;try{p=JSON.parse(el.textContent||'{}');}catch(e){return false;}
  if(!p.u||!p.k||(S.sync.url===p.u&&S.sync.key===p.k))return false;
  if(syncReady()&&S.onboarded&&!confirm(`Ce fichier contient une configuration « ${roleName(p.r)} ». Remplacer la configuration actuelle de cet appareil ?`))return false;
  S.sync.url=p.u;S.sync.key=p.k;S.sync.role=p.r||'';S.sync.venue=p.v||'';S.sync.codes=null;S.sync.auto=true;S.sync.pullAt=0;S.sync.err='';S.onboarded=false;save();return true;}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc8=new TextEncoder(),parts=[],cent=[];let off=0;const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  files.forEach(f=>{const nm=enc8.encode(f.name),data=enc8.encode(f.data),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,z])=>z===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));
    const ch=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,z])=>z===4?ch.setUint32(o,v,true):ch.setUint16(o,v,true));
    parts.push(new Uint8Array(lh.buffer),nm,data);cent.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length;});
  const csz=cent.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));[[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,csz,4],[16,off,4],[20,0,2]].forEach(([o,v,z])=>z===4?end.setUint32(o,v,true):end.setUint16(o,v,true));
  return new Blob([...parts,...cent,new Uint8Array(end.buffer)],{type:'application/zip'});}

  if(t.id==='imp'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const x=JSON.parse(rd.result);if(!x.res)throw 0;await snapNow('avant import de fichier');S=Object.assign(defState(),x,{tab:'data',devId:S.devId});migrate();save();render();document.getElementById('dmsg').textContent='Scores importés.';}catch(err){document.getElementById('dmsg').textContent="Ce fichier n'est pas une sauvegarde de cette application.";}};rd.readAsText(f);return;}

    const art=cl.closest('.mc');art.querySelectorAll('input').forEach(i=>i.value='');art.querySelector('select').value='';updateCard(id);refreshLive();renderFinalsCards();return;}

  if(t.closest('[data-calclub]')){S.tab='prog';S.pClub=S.myClub;S.calMode='grid';save();render();window.scrollTo(0,0);return;}

  if(t.id==='exp'){doExport();return;}
  const b2=t.closest('[data-bk2]');if(b2){const a=b2.dataset.bk2;if(a==='pick')pickFile();if(a==='stop')stopFile();if(a==='perm'){(async()=>{try{BK.filePerm=(await BK.file.requestPermission({mode:'readwrite'}))==='granted';}catch(x){}if(BK.filePerm)await writeFile();updBar();renderSaveStatus();})();}return;}
  const sy=t.closest('[data-sy]');if(sy){const a=sy.dataset.sy;
    if(a==='now')syncNow(true);
    if(a==='live')liveSync(true);
    if(a==='copy')copyText(GS_CODE);
    if(a==='wizard'){showWelcome('start');return;}
    return;}

  const bl=t.closest('[data-bulk]');if(bl){const k=bl.dataset.bulk,cid=k.split('|')[0],tm=k.slice(cid.length+1),c=CATMAP[cid];const ta=[...main.querySelectorAll('[data-bulkta]')].find(x=>x.dataset.bulkta===k);

  if(t.closest('[data-jaall]')){if(!S.sync.codes||!S.sync.codes.ja){toast('Script v5 ou plus requis');return;}showJaAll();return;}
  const rs=t.closest('[data-rst]');if(rs){const all=rs.dataset.rst==='all',o={hours:!!(document.getElementById('rsth')||{}).checked,players:!!(document.getElementById('rstp')||{}).checked};

migrate();
if(!S.v4){Object.keys(S.ts||{}).forEach(id=>{if(S.ts[id]&&S.ts[id]!==(S.sync.sent||{})[id]&&S.res[id])markAll(id);});S.v4=1;}
S.tab=(syncReady()&&S.sync.role==='ja')?'arb':'cat';S.calEdit=false;
officialDefaults();
if(!S.off1&&S.onboarded&&canAdmin()){applyOfficialAll();save();}

showSaved(false);updBar();initBackup();
{const pre=applyHashInvite()||applyPreset();if(!S.onboarded){if(pre)showWelcome('profile');else if(syncReady()||Object.keys(S.res).length){S.onboarded=true;save();}else showWelcome('start');}}
syncUI();if(syncReady()&&S.sync.auto)setTimeout(()=>syncNow(false),2500);
