<title>Carnet de match · Tennis jeunes FRMT</title><style>
:root{--ink:#14212e;--muted:#5a6573;--line:#d5dce3;--paper:#f3f5f7;--card:#fff;--court:#1d4e89;--ball:#d9e84a;--board:#10233a;--win:#1f7a4b;--lose:#b43a2e;--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--fb);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
input,select,button{font:inherit;font-size:16px}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{background:var(--court);color:#fff;padding:16px 16px 14px}header h1{margin:0;font:700 24px var(--fd)}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:720px;margin:0 auto;padding:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
h2{margin:0 0 8px;font:700 18px var(--fd);color:var(--court)}h3{margin:0 0 6px;font-size:14px}
label{display:block;margin:8px 0;font-weight:600;font-size:14px}label select,label input{display:block;width:100%;margin-top:4px}
select,input:not([type=checkbox]){width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);margin:4px 0}
.ck{display:flex;gap:8px;align-items:center;font-weight:500}.ck input{width:20px;height:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.two{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}.seg button.on{background:var(--court);color:#fff;border-color:var(--court)}
.lab{margin:6px 0 0;font-weight:600;font-size:14px}
.big{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--win);color:#fff;font:700 18px var(--fb);margin:12px 0}
.lnk{display:block;width:100%;padding:11px;border:1px dashed var(--court);border-radius:10px;background:transparent;color:var(--court);font-weight:600}
.note{color:var(--muted);font-size:13px;text-align:center}
.board{background:var(--board);color:#fff;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0))}
.bh{display:flex;justify-content:space-between;font-size:13px;color:#9fb0c2;margin-bottom:8px}
.sbr{display:flex;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.12)}.sbr.win .nm{color:var(--ball)}
.sbr .nm{flex:1;font:700 18px var(--fd);min-width:0}.sbr .nm small{display:block;font:500 12px var(--fb);color:#9fb0c2}
.st{min-width:26px;text-align:center;font:700 20px var(--fd);color:#c9d3de}.st.cur{color:#fff}.st sup{font-size:11px}
.pt{min-width:44px;text-align:center;background:var(--ball);color:#10233a;border-radius:6px;font:700 20px var(--fd);padding:2px 4px}
.srv{font-size:15px}.b2{display:inline-block;margin-left:6px;background:#e38b1c;color:#fff;border-radius:5px;padding:0 6px;font:700 12px var(--fb);vertical-align:middle}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.pbtn{min-height:120px;border:0;border-radius:14px;background:var(--court);color:#fff;font-size:15px}.pbtn b{display:block;font:700 20px var(--fd);margin-top:4px}
.pbtn:active{background:var(--ball);color:#10233a}
.srvrow,.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px 8px}
.srvrow button,.tools button{min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.srvrow .warn{background:#e38b1c;border-color:#e38b1c;color:#fff}.big2{align-self:center;font-size:14px}
.det{margin:4px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.det p{margin:0 0 6px;font-size:13px;color:var(--muted)}.det div{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.det button{min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}.det.ok{border-color:var(--win);background:#eef8f1}.det.ok p{color:var(--win);margin:2px 0}.det.ok button{min-height:32px;padding:2px 8px;font-size:13px}
.det button.on{background:var(--ball);border-color:var(--ball);font-weight:700}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;background:var(--board);color:#fff;border-radius:12px;padding:14px;margin:10px 0}
.res div{font:700 17px var(--fd)}.res small{display:block;font:500 12px var(--fb);color:#9fb0c2}.res .win{color:var(--ball)}.res .sc{font:700 22px var(--fd);color:var(--ball)}
.stt{width:100%;border-collapse:collapse;font-size:14px}.stt td,.stt th{padding:7px 4px;border-top:1px solid var(--line);text-align:center}.stt td.l{color:var(--muted);font-size:12.5px}.stt td.gd{background:#e3f4e9;color:#1f7a4b}.stt td.bd{background:#fbe5e2;color:#b43a2e}
.stt small{color:var(--muted)}
.ins{margin-top:8px;font-size:13.5px;background:var(--paper);border-radius:9px;padding:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts button{flex:1 1 140px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600}.acts .big{flex-basis:100%}
.hi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 44px 10px 12px;margin:8px 0;cursor:pointer}.hi b{display:block}.hi span{color:var(--win);font-weight:700}.hi small{display:block;color:var(--muted)}
.hi button{position:absolute;right:8px;top:10px;border:0;background:transparent;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(16,35,58,.95);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.ovb{background:#fff;border-radius:14px;padding:14px;max-width:420px;width:100%;text-align:center}.qr svg{width:100%;height:auto}
.lstats td.gd{background:#e3f4e9;color:#1f7a4b;font-weight:700}.lstats td.bd{background:#fbe5e2;color:#b43a2e}.lleg{margin:4px 0 0;font-size:11px;color:#5a6573;text-align:center}.lleg .gd{color:#1f7a4b;font-weight:700}.lleg .bd{color:#b43a2e;font-weight:700}
.lstats{margin:6px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px}.lstats table{width:100%;border-collapse:collapse;font-size:13.5px}.lstats th{font:700 13px var(--fb);color:var(--court);padding:4px}.lstats td{padding:5px 4px;border-top:1px solid var(--line);text-align:center}.lstats td.l{color:var(--muted);font-size:12px}.lstats small{color:var(--muted)}
.lvb{display:block;text-align:center;font:600 12.5px var(--fb);color:#bff0cf;margin:-4px 0 8px}.lvb.err{color:#ffd08a}.lvb.ban{color:#ff9d92}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--board);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}
@media print{.acts,.lnk,header p{display:none}body{background:#fff}section{break-inside:avoid}}
.rp{background:#fff;color:#14212e;border-radius:12px;padding:14px;font-size:14px;line-height:1.45}
.rp-h h3{margin:0;font:700 20px var(--fd,'Arial Narrow');color:#1d4e89}.rp-h p{margin:2px 0;color:#5a6573}.rp-h .rp-sc{font:700 18px var(--fd,'Arial Narrow');color:#14212e}
.rp-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.rp-k div{background:#f3f5f7;border-radius:10px;padding:8px;text-align:center}.rp-k b{display:block;font:700 22px var(--fd,'Arial Narrow')}.rp-k small{color:#5a6573;font-size:12px}
.rp-mo svg{width:100%;height:auto;border:1px solid #d5dce3;border-radius:8px;background:#fff}.rp-n{color:#5a6573;font-size:12px;margin:4px 0}
.rp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}
.rp-pl{border:1px solid #d5dce3;border-radius:10px;padding:10px}.rp-pl h4{margin:0 0 6px;font:700 17px var(--fd,'Arial Narrow');color:#1d4e89}.rp-pl h4 small{font:500 12px system-ui;color:#5a6573}
.rp-pl h5{margin:10px 0 4px;font-size:13px;color:#14212e;text-transform:uppercase;letter-spacing:.4px}
.rp-sum{display:flex;flex-wrap:wrap;gap:6px}.rp-sum span{background:#f3f5f7;border-radius:6px;padding:2px 8px;font-size:12.5px}
.rp-t{width:100%;border-collapse:collapse;font-size:13px}.rp-t td{padding:4px 4px;border-top:1px solid #eef1f4}.rp-t td:nth-child(2){white-space:nowrap}.rp-t small{color:#5a6573}
.rp-t tr.lv2 td:first-child{color:#1f7a4b;font-weight:600}.rp-t tr.lv0 td:first-child{color:#b43a2e;font-weight:600}
.rp-plan{margin:4px 0;padding-left:18px}.rp-plan li{margin:6px 0;font-size:13.5px}.rp-plan small{color:#5a6573}
@media print{.rp{padding:0}.rp-pl{break-inside:avoid}}
</style></head>

const CAT=id=>DATA.find(c=>c.id===id);
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'.').replace(/=+$/,'');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}};
const sexOfLab=l=>/garçons/i.test(l||'')?'G':/filles/i.test(l||'')?'F':'';
const pl=(c,t)=>((c&&c.teams.find(x=>x.t===t))||{p:[]}).p;
const nmC=(c,t,i)=>{const p=pl(c,t).find(x=>x[3]===+i);return p?p[0]+(p[2]?' ('+p[2]+')':''):'';};
function fmtFrom(c,dbl){const p=c&&c.parts.find(x=>x.t===(dbl?'D':'S'));return p?{tb:p.tb,stb:p.stb,noad:p.noad,one:p.one}:{tb:6,stb:dbl,noad:dbl,one:false};}
const sideName=S0=>S0.n.filter(Boolean).join(' / ')||S0.t||'?';
const sideNameC=S0=>S0.n.map((n,j)=>n?n+' ('+((S0.cl||[])[j]||'NC')+')':'').filter(Boolean).join(' / ')||S0.t||'?';

/* ---------- écran 1 : préparation ---------- */
function renderSetup(){const f=CM.f;if(!f.cat)f.cat=DATA[0].id;const c=CAT(f.cat);
  const m=f.mid&&f.mid!=='F'?c.m.find(x=>x[0]===f.mid):null;
  const part=f.pi!==''&&f.pi!==undefined&&f.mid?c.parts[+f.pi]:null;
  if(m){f.tA=m[1];f.tB=m[2];}if(part)f.dbl=part.t==='D';
  const sx=part?sexOfLab(part.l):'';
  const teamSel=(k,v,lock)=>`<select data-f="${k}"${lock?' disabled':''}><option value="">— club —</option>${c.teams.map(t=>`<option${t.t===v?' selected':''}>${h(t.t)}</option>`).join('')}<option value="*"${v==='*'?' selected':''}>Autre club / hors liste</option></select>`;
  const plSel=(k,t,v)=>t==='*'||!t?`<input data-f="${k}" value="${h(v||'')}" placeholder="Nom du joueur">`:`<select data-f="${k}"><option value="">— joueur —</option>${pl(c,t).filter(p=>!sx||!p[1]||p[1].endsWith(sx)||String(p[3])===String(v)).map(p=>`<option value="${p[3]}"${String(p[3])===String(v)?' selected':''}>${h(p[0])}${p[1]?' · '+h(p[1].replace(/(\d+)([GF])/,(a,b,g)=>b+' ans '+g)):''}${p[2]?' · clt '+p[2]:''}</option>`).join('')}</select>`;
  const fm=f.fmt||'cat';
  APP.innerHTML=`<header><h1>📒 Carnet de match</h1><p>Enregistrez un match point par point, puis envoyez-le à l'organisateur.</p></header>
  <main>
   ${CM.hist.length?`<button class="lnk" data-go="hist">📚 Matchs enregistrés (${CM.hist.length})</button>`:''}
   <section><h2>1. Catégorie et match</h2>
    <label>Catégorie<select data-f="cat">${DATA.map(x=>`<option value="${x.id}"${x.id===f.cat?' selected':''}>${h(x.nom)}</option>`).join('')}</select></label>
    <label>Match<select data-f="mid"><option value="">Hors championnat (entraînement, tournoi…)</option><optgroup label="Rencontres de poule">${c.m.map(x=>`<option value="${x[0]}"${x[0]===f.mid?' selected':''}>${h(x[1])} – ${h(x[2])}${x[3]?' · '+x[3]:''}</option>`).join('')}</optgroup><option value="F"${f.mid==='F'?' selected':''}>Phase finale ou autre rencontre du championnat</option></select></label>
    ${f.mid?`<label>Partie<select data-f="pi"><option value="">— choisir la partie —</option>${c.ord.map(i=>`<option value="${i}"${String(i)===String(f.pi)?' selected':''}>${h(c.parts[i].l)}</option>`).join('')}</select></label>`
      :`<div class="seg"><button data-dbl="0" class="${f.dbl?'':'on'}">Simple</button><button data-dbl="1" class="${f.dbl?'on':''}">Double</button></div>
       <label>Format<select data-f="fmt"><option value="cat"${fm==='cat'?' selected':''}>Comme en championnat pour cette catégorie</option><option value="3s"${fm==='3s'?' selected':''}>3 sets, jeu décisif à 6-6</option><option value="stb"${fm==='stb'?' selected':''}>2 sets + super tie-break</option><option value="one"${fm==='one'?' selected':''}>Un super tie-break (10 points)</option></select></label>`}
   </section>
   <section><h2>2. Joueurs</h2>
    <div class="two"><div><h3>Côté A</h3>${teamSel('tA',f.tA,!!m)}${plSel('a1',f.tA,f.a1)}${f.dbl?plSel('a2',f.tA,f.a2):''}</div>
    <div><h3>Côté B</h3>${teamSel('tB',f.tB,!!m)}${plSel('b1',f.tB,f.b1)}${f.dbl?plSel('b2',f.tB,f.b2):''}</div></div>
   </section>
   <section><h2>3. Départ</h2>
    <p class="lab">Qui sert en premier ?</p><div class="seg"><button data-srv="1" class="${f.srv===2?'':'on'}">Côté A</button><button data-srv="2" class="${f.srv===2?'on':''}">Côté B</button></div>
    <label class="ck"><input type="checkbox" data-f="trk"${f.trk!==false?' checked':''}> Noter 1re / 2e balle, aces et doubles fautes</label>
    <label class="ck"><input type="checkbox" data-f="det"${f.det!==false?' checked':''}> Mode détaillé : winners, fautes directes et coups</label>
    <label class="ck"><input type="checkbox" data-f="live"${f.live?' checked':''}> 📡 Diffuser ce match en Live dans l'appli du championnat (connexion internet nécessaire)</label>
    ${f.mid?'':`<label class="ck"><input type="checkbox" data-f="noad"${f.noad?' checked':''}> Point décisif à 40-40 (No Ad)</label>`}
   </section>
   <button class="big" data-go="start">▶ Commencer le match</button>
   <p class="note">Tout reste enregistré sur ce téléphone, même sans réseau.</p></main>`;}
function startMatch(){const f=CM.f,c=CAT(f.cat),part=f.mid&&f.pi!==''&&f.pi!==undefined?c.parts[+f.pi]:null;
  if(f.mid&&!part){toast('Choisissez la partie');return;}
  const side=(t,k1,k2)=>{const ks=f.dbl?[k1,k2]:[k1];const ix=ks.map(k=>t==='*'||!t?'':f[k]||'');const n=ks.map((k,j)=>t==='*'||!t?String(f[k]||'').trim():(pl(c,t).find(p=>String(p[3])===String(f[k]))||[''])[0]);const cl=ks.map(k=>t==='*'||!t?'':String((pl(c,t).find(p=>String(p[3])===String(f[k]))||[])[2]||''));return {t:t==='*'?'':t||'',i:ix,n,cl};};
  const A=side(f.tA,'a1','a2'),B=side(f.tB,'b1','b2');if(A.n.some(x=>!x)||B.n.some(x=>!x)){toast('Choisissez tous les joueurs');return;}
  let F=part?{tb:part.tb,stb:part.stb,noad:part.noad,one:part.one}:fmtFrom(c,f.dbl);
  if(!part){if(f.fmt==='3s')F={tb:6,stb:false,noad:!!f.noad,one:false};else if(f.fmt==='stb')F={tb:c.u12?5:6,stb:true,noad:!!f.noad,one:false};else if(f.fmt==='one')F={tb:6,stb:true,noad:!!f.noad,one:true};else F.noad=!!f.noad||F.noad;}
  CM.cur={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:new Date().toISOString(),c:f.cat,m:f.mid||'',pi:part?+f.pi:'',lab:part?part.l:(f.dbl?'Double':'Simple'),db:f.dbl?1:0,A,B,t0:Date.now(),
    live:!!f.live,lst:'',L:{pts:[],sv:[],hw:[],srv:f.srv===2?2:1,noad:F.noad,tb:F.tb,stb:F.stb,one:F.one,trk:f.trk===false?0:undefined,det:f.det!==false,flt:false,base:0},ab:0,end:0};
  CM.scr='match';save();render();if(CM.cur.live)pushLive(CM.cur,true);}

/* ---------- diffusion en Live (facultative) ---------- */
let LVT=null;
function livePayload(M){const R=replay(M.L);return JSON.stringify({c:M.c,lab:M.lab,m:M.m,pi:M.pi,A:{t:M.A.t,n:M.A.n,cl:M.A.cl||[]},B:{t:M.B.t,n:M.B.n,cl:M.B.cl||[]},q:encQ(Object.assign({},M.L)),sc:scoreStr(R),ab:M.ab||0});}
function pushLive(M,now){if(!M||!M.live)return;clearTimeout(LVT);LVT=setTimeout(async()=>{try{const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'clive',id:M.id,d:livePayload(M)}),redirect:'follow'});const d=await r.json();
    if(d.banned){M.live=false;M.lst='ban';toast("⛔ Le Live de ce match a été arrêté par l'organisateur");}else if(d.ok)M.lst='ok:'+Date.now();else M.lst='err';}catch(e){M.lst='err';}save();if(CM.scr==='match'&&CM.cur===M)renderMatch();},now?50:1200);}
async function stopLive(M){try{await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'clive_stop',id:M.id}),redirect:'follow'});}catch(e){}}
const liveBadge=M=>M.lst==='ban'?'<span class="lvb ban">⛔ Live arrêté par l\'organisateur</span>':!M.live?'':M.lst&&M.lst.startsWith('ok:')?`<span class="lvb">📡 Live · envoyé à ${new Date(+M.lst.slice(3)).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>`:M.lst==='err'?'<span class="lvb err">📡 Live : pas de réseau, nouvel essai au prochain point</span>':'<span class="lvb">📡 Live : connexion…</span>';
/* ---------- écran 2 : comptage ---------- */
function renderMatch(){const M=CM.cur,L=M.L,R=replay(L),c=CAT(M.c);if(R.w&&!M.end){finish(0);return;}
  const who=[sideName(M.A),sideName(M.B)],whoC=[sideNameC(M.A),sideNameC(M.B)];
  const row=sd=>`<div class="sbr${R.w===sd+1?' win':''}"><span class="nm">${h(whoC[sd])}${!R.w&&R.srv===sd+1?' <span class="srv">🎾</span>'+(L.flt?'<span class="b2">2e balle</span>':''):''}<small>${h([M.A,M.B][sd].t||'')}</small></span>
    ${R.sets.map(s=>`<span class="st">${s[sd]}${s.tb!==undefined&&s[sd]<s[1-sd]?`<sup>${s.tb}</sup>`:''}</span>`).join('')}${R.w?'':`<span class="st cur">${R.stb?R.p[sd]:R.g[sd]}</span><span class="pt">${R.stb?'':ptLabel(R,sd,L)}</span>`}</div>`;
  let det='';if(L.det&&L.pts.length){padSv(L);padHw(L);const k=L.pts.length-1,cd=L.sv[k]||'-';if(L.dk===k){const hw=L.hw[k]||'--',wn=who[L.pts[k]-1],lo=who[2-L.pts[k]];det=`<div class="det ok"><p>✓ Dernier point : ${hw[0]==='W'?'winner de '+h(String(wn).split(' ')[0]):hw[0]==='U'?'faute directe de '+h(String(lo).split(' ')[0]):'faute provoquée'}${hw[1]&&hw[1]!=='-'?' ('+STK[hw[1]].toLowerCase()+')':''} · <button data-hedit>modifier</button></p><p><b>Point suivant →</b></p></div>`;}else if(!/[ABD]/.test(cd)){const hw=L.hw[k]||'--',wn=who[L.pts[k]-1],lo=who[2-L.pts[k]];
    const tb=(x,l)=>`<button class="${hw[0]===x?'on':''}" data-hw="${x}">${l}</button>`;
    det=`<div class="det"><p>Dernier point pour <b>${h(wn)}</b> : comment ?</p><div>${tb('W','🎯 Winner')}${tb('U','❌ Faute directe de '+h(String(lo).split(' ')[0]))}${tb('F','↯ Faute provoquée')}</div>${hw[0]==='W'||hw[0]==='U'?`<div>${Object.keys(STK).map(x=>`<button class="${hw[1]===x?'on':''}" data-hs="${x}">${STK[x]}</button>`).join('')}</div>`:''}</div>`;}}
  APP.innerHTML=`<div class="board">${liveBadge(M)}<div class="bh"><span>${h(c?c.nom:'')} · ${h(M.lab)}</span><span>${R.tb&&!R.stb?'Jeu décisif':R.stb?'Super tie-break':''}</span></div>${row(0)}${row(1)}</div>
   <div class="pts"><button class="pbtn" data-p="1">Point pour<b>${h(who[0])}</b></button><button class="pbtn" data-p="2">Point pour<b>${h(who[1])}</b></button></div>
   ${L.trk===0?'':`<div class="srvrow">${L.flt?`<span class="b2 big2">2e balle</span><button data-a="df" class="warn">✗✗ Double faute</button><button data-a="ace">🎯 Ace</button><button data-a="flt">↶ Annuler la faute</button>`:`<button data-a="flt">✗ Faute de 1re balle</button><button data-a="ace">🎯 Ace</button>`}</div>`}
   ${det}
   <div class="tools">${M.lst==='ban'?'':`<button data-a="live">${M.live?'📡 Arrêter le Live':'📡 Diffuser en Live'}</button>`}<button data-a="undo"${L.pts.length||L.flt?'':' disabled'}>↶ Annuler</button><button data-a="stop">⏹ Terminer…</button></div>
   ${liveStats(L,who.map(x=>h(String(x).split(' ')[0])))}
   <p class="note">${L.pts.length} point${L.pts.length>1?'s':''} · enregistré automatiquement sur ce téléphone</p>`;}
function point(w,code){const L=CM.cur.L;padSv(L);padHw(L);L.sv.push(code);L.hw.push('--');L.flt=false;L.pts.push(w);vib(15);save();renderMatch();pushLive(CM.cur);}

function liveStats(L,names){const st=serveStats(Object.assign({base:0},L,{base:+L.base||0}));const A=st[1],B=st[2];const k=+L.base||0;const pw=[0,0];(L.pts||[]).forEach((p,i)=>{if(i>=k)pw[p-1]++;});
  if(!(pw[0]+pw[1]))return '';const pc=(a,b)=>b?Math.round(100*a/b)+' %':'–',sv=A.s1n+B.s1n>0,dt=A.det+B.det>0,rt=(a,b)=>b?a/b:null;
  /* vert : meilleur des deux sur ce critère ; rouge : moins bon ; rien en cas d'égalité ou sans donnée */
  const r=(l,f,v,show)=>{if(show===false)return '';const a=v(A,0),b=v(B,1);const ca=a===null||b===null||a===b?'':a>b?'gd':'bd',cb=ca===''?'':ca==='gd'?'bd':'gd';return `<tr><td class="${ca}">${f(A,0)}</td><td class="l">${l}</td><td class="${cb}">${f(B,1)}</td></tr>`;};
  return `<div class="lstats"><table><thead><tr><th>${names[0]}</th><th>Statistiques</th><th>${names[1]}</th></tr></thead><tbody>
   ${r('Points gagnés',(x,i)=>`<b>${pw[i]}</b>`,(x,i)=>pw[i])}
   ${r('Jeux de service gagnés',x=>`${pc(x.hold,x.sg)} <small>${x.hold}/${x.sg}</small>`,x=>rt(x.hold,x.sg))}
   ${r('1re balle réussie',x=>`${pc(x.s1in,x.s1n)} <small>${x.s1in}/${x.s1n}</small>`,x=>rt(x.s1in,x.s1n),sv)}
   ${r('Points gagnés 1re / 2e balle',x=>`${pc(x.s1w,x.s1in)} / ${pc(x.s2w,x.s2n)}`,x=>rt(x.s1w+x.s2w,x.s1in+x.s2n),sv)}
   ${r('Aces · doubles fautes',x=>`${x.ace} · ${x.df}`,x=>x.ace-x.df,sv)}
   ${r('Breaks (jeux de retour gagnés)',x=>`${x.brk}/${x.rg}`,x=>x.brk)}
   ${r('Balles de break converties',x=>`${x.bpw}/${x.bpc}`,x=>x.bpw)}
   ${r('Winners · fautes directes',x=>`<b>${x.win}</b> · <b>${x.ue}</b>`,x=>x.win-x.ue,dt)}
  </tbody></table><p class="lleg"><span class="gd">vert</span> = meilleur sur ce critère · <span class="bd">rouge</span> = moins bon</p></div>`;}
/* ---------- écran 3 : fin et statistiques ---------- */
function finish(ab){const M=CM.cur;if(M.live)pushLive(M,true);M.end=Date.now();M.ab=ab||0;const R=replay(M.L);M.sc=scoreStr(R)+(R.w?'':((R.g[0]+R.g[1]||R.p[0]+R.p[1])?' ('+(R.stb?R.p[0]+'-'+R.p[1]:R.g[0]+'-'+R.g[1])+')':''));
  CM.hist=[M].concat(CM.hist.filter(x=>x.id!==M.id)).slice(0,60);CM.view=M.id;CM.cur=null;CM.scr='end';save();render();}
function statRows(st){const A=st[1],B=st[2],r=(l,f,v)=>{const a=v?v(A):null,b=v?v(B):null;const ca=a===null||b===null||a===undefined||b===undefined||a===b?'':a>b?'gd':'bd',cb=ca===''?'':ca==='gd'?'bd':'gd';return `<tr><td class="${ca}">${f(A)}</td><td class="l">${l}</td><td class="${cb}">${f(B)}</td></tr>`;},rt=(a,b)=>b?a/b:null,pc=(a,b)=>b?`<b>${Math.round(100*a/b)} %</b> <small>${a}/${b}</small>`:'–';
  const bd=(x,p)=>Object.keys(STK).filter(k=>x[p+k]).map(k=>`${STK[k]} ${x[p+k]}`).join(', ');
  return [r('Jeux de service gagnés',x=>pc(x.hold,x.sg),x=>rt(x.hold,x.sg)),r('Points gagnés au service',x=>pc(x.spw,x.sp),x=>rt(x.spw,x.sp)),
   A.s1n+B.s1n?r('1re balle réussie',x=>pc(x.s1in,x.s1n),x=>rt(x.s1in,x.s1n)):'',A.s1n+B.s1n?r('Points gagnés derrière la 1re balle',x=>pc(x.s1w,x.s1in),x=>rt(x.s1w,x.s1in)):'',A.s1n+B.s1n?r('Points gagnés sur 2e balle',x=>pc(x.s2w,x.s2n),x=>rt(x.s2w,x.s2n)):'',
   A.s1n+B.s1n?r('Aces',x=>`<b>${x.ace}</b>`,x=>x.ace):'',A.s1n+B.s1n?r('Doubles fautes',x=>`<b>${x.df}</b>`,x=>-x.df):'',
   r('Jeux de retour gagnés (breaks)',x=>pc(x.brk,x.rg),x=>rt(x.brk,x.rg)),r('Points gagnés en retour',x=>pc(x.rpw,x.rp),x=>rt(x.rpw,x.rp)),r('Balles de break converties',x=>pc(x.bpw,x.bpc),x=>x.bpw),r('Balles de break sauvées',x=>pc(x.bps,x.bpf),x=>rt(x.bps,x.bpf)),
   A.det?r('Winners',x=>`<b>${x.win}</b>${bd(x,'w')?`<br><small>${bd(x,'w')}</small>`:''}`,x=>x.win):'',A.det?r('Fautes directes',x=>`<b>${x.ue}</b>${bd(x,'u')?`<br><small>${bd(x,'u')}</small>`:''}`,x=>-x.ue):'',
   A.det?r('Fautes provoquées subies',x=>`<b>${x.fe}</b>`,x=>-x.fe):'',A.tbp?r('Points gagnés dans les jeux décisifs',x=>pc(x.tbw,x.tbp),x=>rt(x.tbw,x.tbp)):''].join('');}
function codeOf(M){return 'FRMT26C:'+enc({v:1,id:M.id,d:M.d,c:M.c,m:M.m,pi:M.pi,lab:M.lab,db:M.db,A:M.A,B:M.B,q:encQ(Object.assign({},M.L)),ab:M.ab,sc:M.sc});}
function renderEnd(){const M=CM.hist.find(x=>x.id===CM.view);if(!M){CM.scr='setup';render();return;}const c=CAT(M.c),st=serveStats(Object.assign({base:0},M.L)),R=replay(M.L);
  const ins=(x,n)=>{const I=svInsights(x);return I.F.length||I.W.length?`<div class="ins"><b>${h(n)}</b>${I.F.length?'<br>💪 '+h(I.F.join(' · ')):''}${I.W.length?'<br>⚠️ '+h(I.W.join(' · ')):''}</div>`:'';};
  const dur=M.end&&M.t0?Math.round((M.end-M.t0)/60000):0;
  APP.innerHTML=`<header><h1>${R.w?'🏆 Match terminé':'⏹ Match arrêté'}</h1><p>${h(c?c.nom:'')} · ${h(M.lab)} · ${new Date(M.d).toLocaleDateString('fr-FR')}${dur?' · '+dur+' min':''}</p></header><main>
   <div class="res"><div class="${R.w===1?'win':''}">${h(sideName(M.A))}<small>${h(M.A.t)}</small></div><div class="sc">${h(M.sc||'')}${M.ab?`<small>abandon de ${h(sideName(M.ab===1?M.A:M.B))}</small>`:''}</div><div class="${R.w===2?'win':''}">${h(sideName(M.B))}<small>${h(M.B.t)}</small></div></div>
   <button class="big" style="background:var(--court)" data-go="rep">🧠 Analyse et plan d'entraînement</button>
   <section><h2>Statistiques du match</h2><table class="stt"><thead><tr><th>${h(sideName(M.A).split(' ')[0])}</th><th></th><th>${h(sideName(M.B).split(' ')[0])}</th></tr></thead><tbody>${statRows(st)}</tbody></table>
    ${ins(st[1],sideName(M.A))}${ins(st[2],sideName(M.B))}</section>
   <section><h2>Envoyer à l'organisateur</h2><p class="note">L'organisateur colle le message dans l'appli du championnat (Partage &amp; PDF › Recevoir), ou scanne le QR code. ${M.m?'Le match sera rattaché à la rencontre choisie.':'Les statistiques iront dans la fiche des joueurs.'}</p>
    <div class="acts"><button class="big" data-go="send">📤 Envoyer (WhatsApp…)</button><button data-go="qr">QR code</button><button data-go="copy">Copier le code</button><button data-go="print">📄 Imprimer / PDF</button></div></section>
   <div class="acts"><button data-go="new">➕ Nouveau match</button><button data-go="hist">📚 Matchs enregistrés</button></div></main>`;}
function renderHist(){APP.innerHTML=`<header><h1>📚 Matchs enregistrés</h1><p>Sur ce téléphone uniquement.</p></header><main>
  ${CM.hist.length?CM.hist.map(M=>`<div class="hi" data-view="${M.id}"><b>${h(sideName(M.A))} – ${h(sideName(M.B))}</b><span>${h(M.sc||'')}</span><small>${h((CAT(M.c)||{}).nom||'')} · ${h(M.lab)} · ${new Date(M.d).toLocaleDateString('fr-FR')}</small><button data-del="${M.id}" aria-label="Supprimer">🗑</button></div>`).join(''):'<p class="note">Aucun match enregistré.</p>'}
  <div class="acts"><button class="big" data-go="new">➕ Nouveau match</button></div></main>`;}
function renderRep(){const M=CM.hist.find(x=>x.id===CM.view);if(!M){CM.scr='setup';return render();}const c=CAT(M.c);
  APP.innerHTML=`<header><h1>🧠 Analyse du match</h1><p>${h(sideName(M.A))} – ${h(sideName(M.B))}</p></header><main>
   ${matchReport({cat:M.c,L:M.L,A:{name:h(sideNameC(M.A)),team:h(M.A.t)},B:{name:h(sideNameC(M.B)),team:h(M.B.t)},title:h((c?c.nom:'')+' · '+M.lab+' · '+new Date(M.d).toLocaleDateString('fr-FR')),score:h(M.sc||'')})}
   <div class="acts" style="margin-top:12px"><button class="big" data-go="print">📄 Imprimer / enregistrer en PDF</button><button data-go="send">📤 Envoyer le match à l'organisateur</button><button data-go="back">← Statistiques</button></div></main>`;}
function render(){if(CM.scr==='match'&&CM.cur)renderMatch();else if(CM.scr==='rep')renderRep();else if(CM.scr==='end')renderEnd();else if(CM.scr==='hist')renderHist();else renderSetup();}

/* ---------- partage ---------- */
async function send(M){const code=codeOf(M),txt=`📒 Carnet de match · ${(CAT(M.c)||{}).nom||''} · ${M.lab}\n${sideName(M.A)} (${M.A.t||'—'}) – ${sideName(M.B)} (${M.B.t||'—'}) : ${M.sc}\n\nPour l'organisateur : collez ce message dans l'appli du championnat (Partage & PDF › Recevoir).\n${code}`;
  try{if(navigator.share){await navigator.share({text:txt});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  location.href='https://wa.me/?text='+encodeURIComponent(txt);}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Code copié')).catch(()=>{prompt('Copiez ce code :',t);});}
function showQR(M){const code=codeOf(M).slice(8),size=500,n=Math.ceil(code.length/size),gid='_c'+Math.floor(Math.random()*46656).toString(36);
  const frames=Array.from({length:n},(_,k)=>`FRMT26Q:${k+1}/${n}:${gid}:${code.slice(k*size,(k+1)*size)}`);let k=0;const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);
  const draw=()=>{const q=qrcode(0,'L');q.addData(frames[k]);q.make();ov.innerHTML=`<div class="ovb"><p>Sur le téléphone de l'organisateur : Partage &amp; PDF › Recevoir › Scanner un QR code.${n>1?' Laissez défiler : chaque code est lu au passage.':''}</p><div class="qr">${q.createSvgTag({cellSize:4,margin:4,scalable:true})}</div><p>${n>1?`Code ${k+1} / ${n}`:''}</p><button class="big" data-x>Fermer</button></div>`;};
  draw();const it=n>1?setInterval(()=>{k=(k+1)%n;draw();},900):0;ov.addEventListener('click',e=>{if(e.target.closest('[data-x]')){clearInterval(it);ov.remove();}});}

/* ---------- événements ---------- */
APP.addEventListener('change',e=>{const t=e.target,k=t.dataset.f;if(!k)return;const f=CM.f;f[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='cat'){f.mid='';f.pi='';f.tA=f.tB=f.a1=f.a2=f.b1=f.b2='';}if(k==='mid'){f.pi='';f.a1=f.a2=f.b1=f.b2='';if(f.mid==='F'||!f.mid){f.tA=f.tB='';}}
  if(k==='pi'){f.a1=f.a2=f.b1=f.b2='';}if(k==='tA'){f.a1=f.a2='';}if(k==='tB'){f.b1=f.b2='';}save();if(t.tagName==='SELECT'||t.type==='checkbox')renderSetup();});
APP.addEventListener('click',e=>{const t=e.target;
  const g=t.closest('[data-go]');if(g){const a=g.dataset.go,M=CM.hist.find(x=>x.id===CM.view);
    if(a==='start')return startMatch();if(a==='hist'){CM.scr='hist';save();return render();}if(a==='new'){CM.scr='setup';save();return render();}
    if(a==='rep'){CM.scr='rep';save();window.scrollTo(0,0);return render();}if(a==='back'){CM.scr='end';save();return render();}
    if(a==='send'&&M)return send(M);if(a==='qr'&&M)return showQR(M);if(a==='copy'&&M)return copy(codeOf(M));if(a==='print')return window.print();return;}
  const d=t.closest('[data-dbl]');if(d){CM.f.dbl=d.dataset.dbl==='1';CM.f.a2=CM.f.b2='';save();return renderSetup();}
  const s=t.closest('[data-srv]');if(s){CM.f.srv=+s.dataset.srv;save();return renderSetup();}
  const vw=t.closest('[data-view]');const del=t.closest('[data-del]');
  if(del){if(confirm('Supprimer ce match du téléphone ?')){CM.hist=CM.hist.filter(x=>x.id!==del.dataset.del);save();renderHist();}return;}
  if(vw){CM.view=vw.dataset.view;CM.scr='end';save();return render();}
  if(CM.scr!=='match'||!CM.cur)return;const L=CM.cur.L,R=replay(L);
  const p=t.closest('[data-p]');if(p){if(R.w)return;point(+p.dataset.p,L.trk===0?'-':(L.flt?'S':'F'));return;}
  const hw=t.closest('[data-hw]'),hs=t.closest('[data-hs]');
  if(t.closest('[data-hedit]')){L.dk=-1;save();return renderMatch();}
  if(hw||hs){padHw(L);const k=L.pts.length-1;if(k<0)return;const c0=L.hw[k]||'--';if(hw){const v=hw.dataset.hw;L.hw[k]=(c0[0]===v?'-':v)+(v==='F'?'-':c0[1]);if(v==='F'&&L.hw[k][0]==='F'){L.dk=k;vib(10);}}else{const v=hs.dataset.hs;L.hw[k]=c0[0]+v;L.dk=k;vib(10);}save();return renderMatch();}
  const a=t.closest('[data-a]');if(!a)return;const v=a.dataset.a;
  if(v==='live'){const M=CM.cur;M.live=!M.live;if(M.live)pushLive(M,true);else{stopLive(M);M.lst='';}save();return renderMatch();}
  if(v==='flt'){L.flt=!L.flt;save();renderMatch();return pushLive(CM.cur);}
  if(v==='ace'||v==='df'){if(R.w)return;const sv=R.srv||1;point(v==='ace'?sv:3-sv,v==='ace'?(L.flt?'B':'A'):'D');return;}
  if(v==='undo'){if(L.flt){L.flt=false;}else{padSv(L);padHw(L);L.pts.pop();L.sv.pop();L.hw.pop();}save();renderMatch();return pushLive(CM.cur);}
  if(v==='stop'){const w=[sideName(CM.cur.A),sideName(CM.cur.B)];const ch=prompt(`Terminer le match :\n1 = abandon de ${w[0]}\n2 = abandon de ${w[1]}\n3 = arrêter sans vainqueur (match non terminé)\n\nTapez 1, 2 ou 3 :`,'3');
    if(ch==='1'||ch==='2')finish(+ch);else if(ch==='3')finish(0);return;}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('carnet-sw.js',{scope:'./carnet.html'}).catch(()=>{});
</script></body></html>
